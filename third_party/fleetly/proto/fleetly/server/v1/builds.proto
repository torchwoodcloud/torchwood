syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// BuildsService 是构建资源面（T2.18）：builds 表状态机（queued/building/
// succeeded/failed）的写入与读取。独立成 service 的理由：构建是自有资源与
// 独立状态机（builds 表，审计 build.create/start/finish 随行），不挂
// deployment.* 事件、不占部署资源面——并入 DeploymentsService 会混淆两类
// 生命周期。
//
// TriggerBuild 契约取舍（T2.18 设计裁决）：与 Deploy 同型——客户端传
// compose 内容字节，服务端解析受控子集、裁决构建目标（railpack/dockerfile
// 双驱动 + image 直通）并逐服务入队，返回构建行后立即返回；等待终态由
// 客户端轮询 GetBuild。base_dir 承载构建上下文解析基准（context 相对路径
// 的宿主基准目录）——v0.1 单机同宿主语义：CLI 与 fleetlyd 共享文件系统，
// 与旧 CLI 直连入队的 context 绝对路径等价；空 = 服务端临时目录（上下文
// 随 compose 暂存形态，纯 image/无上下文构建可用）。
//
// 信任边界（H14 整改）：TriggerBuild 要求 admin scope——base_dir 可指向
// 宿主任意目录，构建把整目录打进镜像，与 env 明文读取同级信任，不随
// deploy scope 下放。且 build.context 解析后必须位于 base_dir（缺省为
// 服务端临时目录）之内，`..` 逃逸形态拒绝（E_COMPOSE_UNSUPPORTED）；
// 执行侧另要求 context_dir 位于平台受管根（系统 temp / git 根 /
// build.context_roots 配置根）内，越界构建终态失败（E_BUILD_FAILED）。
service BuildsService {
  rpc TriggerBuild(TriggerBuildRequest) returns (TriggerBuildResponse) {
    option (google.api.http) = {
      post: "/v1/builds"
      body: "*"
    };
  }
  // BuildFromUpload 受理「上下文 tar 包 + Dockerfile 入口」构建（T 线 DT-6 /
  // IMPL-T2-2）：client-streaming——首帧 metadata（镜像仓名 + Dockerfile 入口），
  // 后续帧为上下文 tar 分片（服务端流式解包，不落 tar 中间文件）。服务端与
  // git 构建共用同一队列/buildkitd 管线与同一信任面（无新增构建参数面），
  // 产物平台侧推 zot / 本机装载，**调用方永不需要 push 凭证**；等待终态后
  // 返回 builds 行投影（含 digest 钉定引用，可直接被 CreateTask/部署引用）。
  //
  // 传输面（审查裁决，如实登记）：gRPC client-streaming；**无 HTTP 注解**
  // ——grpc-gateway 对 client-streaming 只支持「单帧消息」形态，REST 面不
  // 承载本 RPC（CLI/SDK 消费；REST 限制见 docs 实施记录）。scope = 独立
  // `build`（read/deploy 不蕴含，admin 蕴含——机具令牌典型持有者，tasks/
  // terminal 同族）。
  rpc BuildFromUpload(stream BuildFromUploadRequest) returns (BuildFromUploadResponse) {
    // 无 google.api.http 注解（gRPC-only，见上）。
  }
  rpc GetBuild(GetBuildRequest) returns (GetBuildResponse) {
    option (google.api.http) = { get: "/v1/builds/{id}" };
  }
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/builds" };
  }
}

// BuildFromUploadRequest 是上传构建的流帧（oneof）：首帧 metadata，后续帧
// chunk（tar 分片）。任何其他形态（首帧无 metadata、metadata 重复、帧既无
// metadata 又无 chunk、超单帧上限）一律 E_BUILD_UPLOAD_INVALID 拒绝。
message BuildFromUploadRequest {
  oneof payload {
    // 首帧且仅首帧携带。
    BuildFromUploadMetadata metadata = 1;
    // 上下文 tar 分片（单帧 ≤ 1MiB；总字节 ≤ 平台上限——超限
    // E_BUILD_UPLOAD_TOO_LARGE）。
    bytes chunk = 2;
  }
}

// BuildFromUploadMetadata 是上传构建的请求头（传输面元数据）。
//
// 信任级红线（IMPL-T2-2）：与 git 构建**同信任级**——本消息不含 target/
// build-args/secrets/platform 等任何额外构建参数（无特赦亦无歧视）；解包
// 后的 Dockerfile 走与 git 构建逐字相同的 dockerfile.v0 前端。
message BuildFromUploadMetadata {
  // 镜像仓库组件名（平台 registry 路径 <host>/apps/<name>；服务端转小写，
  // 首末位须为字母数字，可含 . _ -，≤100——tag 以 <name>-<buildid> 派生）。
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Dockerfile 入口（相对上下文根的仓内路径；缺省 Dockerfile）。服务端
  // 校验：clean 相对路径、不越出上下文根、解析后为常规文件。
  string dockerfile = 2 [(buf.validate.field).string.max_len = 256];
}

// BuildFromUploadResponse 返回终态构建行（succeeded；失败经错误信封点名
// error_code 与 build id）。image_ref/image_digest 是 digest 钉定引用——
// registry 模式 `<host>/apps/<name>@sha256:<manifest digest>`；本地模式
// `fleetly-local/<name>:<tag>` + 本机不可变 ID。
message BuildFromUploadResponse {
  BuildView build = 1;
}

message TriggerBuildRequest {
  // compose 文件内容字节（JSON/YAML 原文；应用名取自 compose name——请求
  // 无 app 字段，单源无错位面（A1 注记；若后续加 app 字段须与 Deploy 同款
  // 一致性校验）；服务端解析受控子集——compose 违约不动底座、不入队）。
  bytes compose = 1 [(buf.validate.field).bytes.min_len = 1];
  // 只构建该 compose 服务；空 = 全部 build 模式服务。
  string service = 2;
  // 构建上下文解析基准目录（context 相对路径的宿主基准；空 = 服务端临时
  // 目录）。v0.1 单机同宿主语义，见 service 注释（H14：admin scope，且
  // context 解析后不得越出该基准目录）。
  string base_dir = 3;
  // 目标项目（v0.3 W2-S3 归属管道）：仅在该 app 尚不存在、构建自动建行时
  // 消费——解析与缺省语义同 DeployRequest.project（D-W0-9；机具令牌必须
  // 显式）。app 行已在时沿用行上归属，本字段忽略。
  string project = 4 [(buf.validate.field).string.max_len = 65];
}

message TriggerBuildResponse {
  // 应用名（compose name；应用不存在时自动创建——与 deploy 同语义）。
  string app = 1;
  // 入队的构建行（status 恒 "queued"）。
  repeated BuildView builds = 2;
  // compose 校验期非阻断标注（与 Deploy 同口径透传）。
  repeated ComposeWarning warnings = 3;
  // 直通服务（仅 image 无 build——不建行不构建，附镜像引用）。
  repeated PassthroughService passthrough = 4;
}

// PassthroughService 是镜像模式服务的直通报告（无构建行）。
message PassthroughService {
  string service = 1;
  string image = 2;
}

message GetBuildRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetBuildResponse {
  BuildView build = 1;
}

message ListBuildsRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // 返回上限（缺省 20，天花板 100）。
  int32 limit = 2 [(buf.validate.field).int32 = { gte: 0, lte: 100 }];
}

message ListBuildsResponse {
  repeated BuildView builds = 1;
}

// BuildView 是构建行的只读投影（词表与 state 层一致：queued/building/
// succeeded/failed；driver ∈ railpack/dockerfile/passthrough）。
message BuildView {
  string id = 1;
  string app = 2;
  string service = 3;
  string driver = 4;
  string status = 5;
  // 成功终态必非空（image_ref ↔ image_digest，D9 digest 引用）。
  string image_ref = 6;
  string image_digest = 7;
  // 产物归档路径（railpack plan JSON / 构建日志）。
  string plan_path = 8;
  string log_path = 9;
  // 失败终态的注册表错误码。
  string error_code = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
}

// ComposeWarning 是 compose 校验期非阻断标注的跨面投影（deploy/build 共
// 用；code = 注册表 W_ 码，无注册码提示以 kind 承载稳定标识）。
message ComposeWarning {
  string kind = 1;
  string code = 2;
  string service = 3;
  string message = 4;
}
