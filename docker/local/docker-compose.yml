services:
  postgres:
    # Percona Distribution for PostgreSQL：发行版镜像自带 pgvector（0.8.3，
    # ≥0.8 满足 iterative scan 契约）及 pg_stat_monitor/pgaudit/pg_repack/
    # pg_tde 等常用扩展，替代原 pgvector/pgvector 单一扩展镜像。
    # entrypoint 为官方 docker-library 脚本 fork，POSTGRES_* 与
    # POSTGRES_INITDB_ARGS 语义一致。
    # 数据目录是 /data/db（PG18 官方系镜像为 /var/lib/postgresql）——换镜像
    # 必须同步改挂载点，否则 initdb 落在容器层，容器重建即丢数据。
    # locale=C 时 initdb 默认服务端编码是 SQL_ASCII，而 pgdriver（bun
    # ≥1.2.16）握手期校验 ParameterStatus，client_encoding≠UTF8 直接拒连，
    # 故必须显式 --encoding=UTF8（排序语义由 locale=C 锁定，与 CI 一致）。
    # 编码只在首次 initdb 生效。
    image: percona/percona-distribution-postgresql:18
    container_name: torchwood-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-torchwood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-torchwood}
      POSTGRES_DB: ${POSTGRES_DB:-torchwood}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torchwood} -d ${POSTGRES_DB:-torchwood}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torchwood-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: torchwood-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
