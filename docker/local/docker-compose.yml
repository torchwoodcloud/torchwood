services:
  postgres:
    # pgvector 官方镜像（会话 #10：vector 列 + HNSW 索引）。锁 0.8.6（≥0.8
    # 才有 iterative scan），PG 主版本与原 postgres:18 一致。
    # vector 非 trusted extension：非 superuser 部署的启用引导（superuser
    # 预装路径）见 docs/developer/13-operations.md §6.6。
    # Debian 基座 initdb 默认 en_US.utf8，与原 alpine 基座（musl，C）不同——
    # 字符串排序语义会变（如 id 排序平局的保留选择）。显式锁 C 保持与
    # alpine 时代及 CI 一致；已有卷不受影响（initdb 仅首次建库生效）。
    # locale=C 时 initdb 默认服务端编码是 SQL_ASCII，而 pgdriver（bun
    # ≥1.2.16）握手期校验 ParameterStatus，client_encoding≠UTF8 直接拒连，
    # 故必须显式 --encoding=UTF8（排序语义仍由 locale=C 锁定）。编码只在
    # 首次 initdb 生效：老 SQL_ASCII 卷需 down -v 重建后才生效。
    image: pgvector/pgvector:0.8.6-pg18
    container_name: torchwood-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-torchwood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-torchwood}
      POSTGRES_DB: ${POSTGRES_DB:-torchwood}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torchwood} -d ${POSTGRES_DB:-torchwood}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torchwood-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: torchwood-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
