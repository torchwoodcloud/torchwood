# Torchwood 运行时配置基线（docker/fleetly 栈，IMPL-T2-4）
#
# 本文件是 docker/dokploy/config.yaml 的 fleetly 形态副本：由平台 Config 资源
# 提供（external 值经 configs API 上传），compose 挂载到 server/worker/dispatcher
# 的 /app/configs/config.yaml；环境变量 TORCHWOOD_* 覆盖优先（平台 env 层），
# 密钥类（jwt secret / setup token / DB DSN / S3 凭据）一律由平台 env 注入，
# 不落此文件。**与 docker/dokploy/config.yaml 保持同内容**：键位变更两处同改
# （dokploy 栈退役后本文件为唯一真源）。
# 完整键位说明见 configs/config.yaml.template 与 docs/developer/13-operations.md §4。

server:
  http:
    addr: ":9080"
    timeout: "60s"
    # 对外绝对地址基准（OAuth/支付回调），由 env TORCHWOOD_SERVER_HTTP_PUBLIC_URL 覆盖
    public_url: "https://change-me.example.com"
    cors:
      # 基线 ["*"]（compose env 同默认）：非凭据跨域放开——SDK/前端以 Bearer
      # token 调 API，CORS 不是授权边界；中间件对请求 Origin 回显 ACAO + Vary。
      # OAuth 浏览器流走 /v1/account/oauth2/{provider}/authorize 302 端点，不经 CORS。
      # 如需跨站携带会话 cookie 的特殊形态：allow_origins 显式列出来源，
      # 并把 allow_credentials 改回 true（带凭据时不接受 "*"，见 cmd/server/internal/runtime/cors.go）
      allow_origins: ["*"]
      allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      allow_headers: ["Content-Type", "Authorization", "X-Api-Key", "X-Torchwood-Project", "X-Request-Id", "X-Correlation-Id", "Idempotency-Key"]
      allow_credentials: false
      max_age: 3600
  grpc:
    # 监听全部网卡供 SDK/CLI 外部直连（compose env 覆盖同值）；gateway 同进程
    # 转发目标自动回落 127.0.0.1:9060。明文 h2c，外部访问须配防火墙来源限制
    addr: ":9060"
    timeout: "30s"
  metrics:
    # 无鉴权，仅回环；如需采集请走只读边车/VPN
    addr: "127.0.0.1:9040"

security:
  jwt:
    secret: ""              # 必填：env TORCHWOOD_SECURITY_JWT_SECRET
    access_ttl: "15m"
    refresh_ttl: "7d"
  encryption_key: ""        # 可选：env TORCHWOOD_SECURITY_ENCRYPTION_KEY（未配置回退 jwt.secret）
  api_key:
    header: "x-api-key"
  setup_token: ""           # 必填：env TORCHWOOD_SECURITY_SETUP_TOKEN
  trusted_proxies: []       # compose 已注入 127.0.0.1/32 + docker 私网段
  sessions:
    max_per_user: 50
  rate_limit:
    enabled: true
    ip:
      limit: 300
      window: "60s"
    user:
      limit: 1000
      window: "60s"
    api_key:
      limit: 6000
      window: "60s"

data:
  database:
    # 运行态必须是非 superuser tw_authenticator（compose 注入），superuser 绕过 RLS
    source: ""
    debug: false
    slow_query_threshold: "500ms"
    pool:
      max_idle_conns: 4
      max_open_conns: 16
      conn_max_lifetime: "1h"
      conn_max_idle_time: "30m"
  redis:
    addr: "redis:6379"
    password: ""            # 栈内网络默认免密；加固时同步改 redis 服务与 env TORCHWOOD_DATA_REDIS_PASSWORD
    db: 0

storage:
  provider: "minio"
  s3:
    endpoint: "http://minio:9000"   # 接外部 S3 时改这里 + env 凭据；bucket 由应用启动时自动创建
    region: "us-east-1"
    bucket: "torchwood-storage"     # S3/MinIO 要求全小写
    access_key_id: ""               # env TORCHWOOD_STORAGE_S3_ACCESS_KEY_ID
    secret_access_key: ""           # env TORCHWOOD_STORAGE_S3_SECRET_ACCESS_KEY

functions:
  # 执行底座 = fleetly 平台（IMPL-T2-3）：函数实例 = fleetly Tasks、构建 =
  # fleetly build-from-upload；本仓零 docker client。fleetly 端点/机具令牌
  # 由 compose 环境变量注入（token 不进本文件）。
  docker:
    # host/network 键已删除：dispatcher 不再消费 docker 宿主配置。
    # 平台镜像命名前缀（逻辑寻址键；见 functions.fleetly）。
    registry: "torchwood-funcs"
  fleetly:
    # env: TORCHWOOD_FUNCTIONS_FLEETLY_ENDPOINT / _TOKEN / _APP / _NETWORK_MEMBERS
    endpoint: ""
    token: ""
    app: ""
    network_members: []
  dispatcher:
    # 镜像缺失自动重建（执行链自愈）：构建产物引用映射缺失/被清理或
    # fleetly 侧镜像解析失败时，执行命中即异步触发重建——zip/git 源从持久
    # 桶（下方 functions.storage）拉回复核重建，git 源桶 miss 回退 packer
    # 重物化。关闭后仅剩 412 报错引导人工 redeploy。
    rebuild_on_missing_image: true
  storage:
    # 部署代码包持久桶：镜像重建的源。桶为平台内部资源（不进用户 bucket
    # 命名空间），连接复用上方 storage.s3 的 endpoint/凭证——MinIO/S3 因此
    # 是函数部署的硬依赖。存量部署（持久层上线前创建）桶内无副本，镜像
    # 丢失后无法自愈，须 redeploy。
    bucket: "torchwood-functions"

payments:
  stripe:
    api_base_url: ""
  wechat:
    mch_id: ""
    app_id: ""
    notify_url: ""
    api_base_url: ""
  alipay:
    app_id: ""
    notify_url: ""
    gateway_url: ""
  ios_iap:
    bundle_id: ""
    issuer_id: ""
    key_id: ""
    verify_receipt_url: ""
    sandbox_verify_url: ""

telemetry:
  enabled: false
  otlp_endpoint: ""
  service_name: "Torchwood"

messaging:
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: "noreply@torchwood.local"
    use_tls: true
  # 生产环境发送路径在无 SMTP/SMS 配置时直接拒绝（防 OTP 泄漏日志），保持 false
  dev_log_otp: false
  dev_log_sms: false
  sms:
    provider: ""
    twilio:
      account_sid: ""
      auth_token: ""
      from: ""

idgen:
  default_strategy: uuid
  random:
    length: 10
    charset: numeric
    redis_key_prefix: Torchwood:id:random
    max_retries: 10
  snowflake:
    node_id: 0
  sequence:
    redis_key_prefix: Torchwood:seq
  resources:
    users: uuid
    sessions: uuid
    documents: uuid
