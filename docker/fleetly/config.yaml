# Torchwood 运行时配置基线（docker/fleetly 栈）
#
# 本文件由平台 Config 资源提供（external 值经 configs API 上传），compose 挂载到
# server/worker 的 /app/configs/config.yaml；环境变量 TORCHWOOD_* 覆盖优先（平台
# env 层），密钥类（jwt secret / setup token / DB DSN / S3 凭据）一律由平台 env
# 注入，不落此文件。Functions v4 起 functions 段与 dokploy 侧同构（无 driver
# 分叉），键位变更两处同改。
# 完整键位说明见 configs/config.yaml.template 与 docs/developer/13-operations.md §4。

server:
  http:
    addr: ":9080"
    timeout: "60s"
    # 对外绝对地址基准（OAuth/支付回调），由 env TORCHWOOD_SERVER_HTTP_PUBLIC_URL 覆盖
    public_url: "https://change-me.example.com"
    cors:
      # 基线 ["*"]（compose env 同默认）：非凭据跨域放开——SDK/前端以 Bearer
      # token 调 API，CORS 不是授权边界；中间件对请求 Origin 回显 ACAO + Vary。
      # OAuth 浏览器流走 /v1/account/oauth2/{provider}/authorize 302 端点，不经 CORS。
      # 如需跨站携带会话 cookie 的特殊形态：allow_origins 显式列出来源，
      # 并把 allow_credentials 改回 true（带凭据时不接受 "*"，见 cmd/server/internal/runtime/cors.go）
      allow_origins: ["*"]
      allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      allow_headers: ["Content-Type", "Authorization", "X-Api-Key", "X-Torchwood-Project", "X-Request-Id", "X-Correlation-Id", "Idempotency-Key"]
      allow_credentials: false
      max_age: 3600
  grpc:
    # 监听全部网卡供 SDK/CLI 外部直连（compose env 覆盖同值）；gateway 同进程
    # 转发目标自动回落 127.0.0.1:9060。明文 h2c，外部访问须配防火墙来源限制
    addr: ":9060"
    timeout: "30s"
  metrics:
    # 无鉴权，仅回环；如需采集请走只读边车/VPN
    addr: "127.0.0.1:9040"

security:
  jwt:
    secret: ""              # 必填：env TORCHWOOD_SECURITY_JWT_SECRET
    access_ttl: "15m"
    refresh_ttl: "7d"
  encryption_key: ""        # 可选：env TORCHWOOD_SECURITY_ENCRYPTION_KEY（未配置回退 jwt.secret）
  api_key:
    header: "x-api-key"
  setup_token: ""           # 必填：env TORCHWOOD_SECURITY_SETUP_TOKEN
  trusted_proxies: []       # compose 已注入 127.0.0.1/32 + docker 私网段
  sessions:
    max_per_user: 50
  rate_limit:
    enabled: true
    ip:
      limit: 300
      window: "60s"
    user:
      limit: 1000
      window: "60s"
    api_key:
      limit: 6000
      window: "60s"

data:
  database:
    # 运行态必须是非 superuser tw_authenticator（compose 注入），superuser 绕过 RLS
    source: ""
    debug: false
    slow_query_threshold: "500ms"
    pool:
      max_idle_conns: 4
      max_open_conns: 16
      conn_max_lifetime: "1h"
      conn_max_idle_time: "30m"
  redis:
    addr: "redis:6379"
    password: ""            # 栈内网络默认免密；加固时同步改 redis 服务与 env TORCHWOOD_DATA_REDIS_PASSWORD
    db: 0

storage:
  provider: "minio"
  s3:
    endpoint: "http://minio:9000"   # 接外部 S3 时改这里 + env 凭据；bucket 由应用启动时自动创建
    region: "us-east-1"
    bucket: "torchwood-storage"     # S3/MinIO 要求全小写
    access_key_id: ""               # env TORCHWOOD_STORAGE_S3_ACCESS_KEY_ID
    secret_access_key: ""           # env TORCHWOOD_STORAGE_S3_SECRET_ACCESS_KEY

functions:
  # Functions v4（docs/design/functions-v4.md）：函数 = endpoint 常驻服务，
  # torchwood 只做路由/身份/记账/投递——执行面（打包/构建/部署/池/运行时/
  # 变量）整体外包（fleetly CLI 或用户自有工具链）。旧 driver/docker/fleetly/
  # execution/dispatcher/packer/image/storage 段已整体退役（config.proto
  # reserved）：存量 yaml 残留键会被容忍忽略（proto 未知字段）。
  invoke:
    # 放行私网/回环 target（ssrfguard 拨号点校验的平台级放行）：仅自托管形态
    # 下函数与 server 同处可信私网（fleetly 任务网成员挂靠 / k8s Service /
    # 裸机内网）时显式开启——平台级信任决策，非 per-request 开关；托管形态
    # 恒 false（默认）。
    # env: TORCHWOOD_FUNCTIONS_INVOKE_ALLOW_PRIVATE_TARGETS
    allow_private_targets: false
  trigger:
    # HTTP 触发器公开端点（/f/{project}/{token}）的 per-IP 固定窗口限频
    # （次/分钟，默认 3000）。
    # env: TORCHWOOD_FUNCTIONS_TRIGGER_HTTP_IP_PER_MINUTE
    http_ip_per_minute: 3000
  client_invoke:
    # 客户端调用面平台级参数（per-function 的配额/窗口在 functions 表策略列）。
    # 每用户并发闸门上限（默认 8；进程内 keyed 信号量——多实例部署下为近似
    # 全局，全局上限 = 上限 × 实例数）。
    # env: TORCHWOOD_FUNCTIONS_CLIENT_INVOKE_PER_USER_CONCURRENCY
    per_user_concurrency: 8
    # 并发闸门排队队首超时（超时 ResourceExhausted，默认 10s）。
    # env: TORCHWOOD_FUNCTIONS_CLIENT_INVOKE_QUEUE_HEAD_TIMEOUT
    queue_head_timeout: "10s"
  webhooks:
    # Webhooks 一等公民平台级配置（15 次/24h 指数退避 + 行内 DLQ + Redeliver
    # API）。全部字段可选，注释值即缺省。
    # 重试梯度（失败后按序取用，末值循环）。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_RETRY_BACKOFF
    retry_backoff: "10s,1m,5m,30m,2h,8h"
    # 最大投递尝试次数（含首投；达到即终态 failed = DLQ）。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_MAX_ATTEMPTS
    max_attempts: 15
    # 重试窗（首投起算的终态封顶）。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_RETRY_WINDOW
    retry_window: "24h"
    # 单轮到期扫描的投递并发上限（worker 进程内）。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_DELIVERY_CONCURRENCY
    delivery_concurrency: 4
    # 单次投递尝试的 HTTP 超时。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_DELIVERY_TIMEOUT
    delivery_timeout: "10s"
    # 投递行保留窗（终态行清理口径；7 天）。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_RETENTION
    retention: "168h"
    # 密钥轮换宽限窗（旧钥 v2 签名保留期）。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_SECRET_GRACE_PERIOD
    secret_grace_period: "24h"
    # per-project webhook 数上限。
    # env: TORCHWOOD_FUNCTIONS_WEBHOOKS_MAX_PER_PROJECT
    max_per_project: 32

payments:
  stripe:
    api_base_url: ""
  wechat:
    mch_id: ""
    app_id: ""
    notify_url: ""
    api_base_url: ""
  alipay:
    app_id: ""
    notify_url: ""
    gateway_url: ""
  ios_iap:
    bundle_id: ""
    issuer_id: ""
    key_id: ""
    verify_receipt_url: ""
    sandbox_verify_url: ""

messaging:
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: "noreply@torchwood.local"
    use_tls: true
  # 生产环境发送路径在无 SMTP/SMS 配置时直接拒绝（防 OTP 泄漏日志），保持 false
  dev_log_otp: false
  dev_log_sms: false
  sms:
    provider: ""
    twilio:
      account_sid: ""
      auth_token: ""
      from: ""

idgen:
  default_strategy: uuid
  random:
    length: 10
    charset: numeric
    redis_key_prefix: Torchwood:id:random
    max_retries: 10
  snowflake:
    node_id: 0
  sequence:
    redis_key_prefix: Torchwood:seq
  resources:
    users: uuid
    sessions: uuid
    documents: uuid
