syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service GroupsService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_SERVER };

  rpc CreateGroup(CreateGroupRequest) returns (Group) {
    option (google.api.http) = { post: "/v1/server/groups", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_WRITE }
    };
  }

  rpc ListGroups(shared.v1.ListRequest) returns (ListGroupsResponse) {
    option (google.api.http) = { get: "/v1/server/groups" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_READ }
    };
  }

  rpc GetGroup(GetGroupRequest) returns (Group) {
    option (google.api.http) = { get: "/v1/server/groups/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_READ }
    };
  }

  rpc DeleteGroup(GetGroupRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/groups/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_WRITE }
    };
  }

  rpc GetGroupPrefs(GetGroupRequest) returns (GetGroupPrefsResponse) {
    option (google.api.http) = { get: "/v1/server/groups/{id}/prefs" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_READ }
    };
  }

  rpc UpdateGroupPrefs(UpdateGroupPrefsRequest) returns (GetGroupPrefsResponse) {
    option (google.api.http) = { put: "/v1/server/groups/{id}/prefs", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_WRITE }
    };
  }

  rpc CreateMembership(CreateMembershipRequest) returns (Membership) {
    option (google.api.http) = { post: "/v1/server/groups/{group_id}/memberships", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_WRITE }
    };
  }

  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse) {
    option (google.api.http) = { get: "/v1/server/groups/{group_id}/memberships" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_READ }
    };
  }

  rpc GetMembership(GetMembershipRequest) returns (Membership) {
    option (google.api.http) = { get: "/v1/server/groups/{group_id}/memberships/{membership_id}" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_READ }
    };
  }

  rpc UpdateMembership(UpdateMembershipRequest) returns (Membership) {
    option (google.api.http) = { patch: "/v1/server/groups/{group_id}/memberships/{membership_id}", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_WRITE }
    };
  }

  rpc UpdateMembershipStatus(UpdateMembershipStatusRequest) returns (Membership) {
    option (google.api.http) = { patch: "/v1/server/groups/{group_id}/memberships/{membership_id}/status", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_WRITE }
    };
  }

  rpc DeleteMembership(GetMembershipRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/groups/{group_id}/memberships/{membership_id}" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_GROUPS, op: SCOPE_OP_WRITE }
    };
  }
}

message CreateGroupRequest {
  string name = 1;
  repeated string permissions = 2;
}

message GetGroupRequest {
  string id = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message GetGroupPrefsResponse {
  google.protobuf.Struct prefs = 1;
}

message UpdateGroupPrefsRequest {
  string id = 1;
  google.protobuf.Struct prefs = 2 [(buf.validate.field).required = true];
}

message Group {
  string id = 1;
  string name = 2;
  int32 total = 3;
  repeated string permissions = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Membership {
  string id = 1;
  string group_id = 2;
  string user_id = 3;
  string email = 4;
  string name = 5;
  repeated string roles = 6;
  string status = 7;
  google.protobuf.Timestamp invited_at = 8;
  google.protobuf.Timestamp joined_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateMembershipRequest {
  string group_id = 1;
  string user_id = 2;
  string email = 3;
  string name = 4;
  repeated string roles = 5;
  string status = 6;
}

message ListMembershipsRequest {
  string group_id = 1;
  // 不支持：groups 面不消费查询过滤，携带即 InvalidArgument（服务端显式
  // 拒绝，不再静默忽略）。成员定位用 group_id 路径参数 + 分页。
  repeated string queries = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetMembershipRequest {
  string group_id = 1;
  string membership_id = 2;
}

message ListMembershipsResponse {
  repeated Membership memberships = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message UpdateMembershipRequest {
  string group_id = 1;
  string membership_id = 2;
  repeated string roles = 3;
}

message UpdateMembershipStatusRequest {
  string group_id = 1;
  string membership_id = 2;
  string status = 3;
}
