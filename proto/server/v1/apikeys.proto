syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  // PERMISSION 面：key 凭证禁入，仅 console admin 会话（cookie）。
  security: {
    security_requirement: {
      key: "cookie"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "permission" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service APIKeysService {
  // 平台专属面（决策 v8）：全服务 PERMISSION owner/admin——API key 是平台级
  // 凭据，管理权（含元数据读）仅 owner/admin console 会话；API key 凭证一律
  // 拒绝（防泄露 key 自铸新 key 永久提权），apikeys scope 资源随之退役
  // （key 不再可被授予 apikeys.read/write）。
  // 唯一例外是 WhoAmI（自证凭证型 PUBLIC，逐方法覆盖）：它不管理 key、只
  // 描述调用凭证自身，"知道 key 明文"即是查询授权，无自铸面。
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_PERMISSION };
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (APIKeyWithSecret) {
    option (google.api.http) = { post: "/v1/server/api-keys", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }

  rpc ListAPIKeys(shared.v1.ListRequest) returns (ListAPIKeysResponse) {
    option (google.api.http) = { get: "/v1/server/api-keys" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }

  rpc GetAPIKey(GetAPIKeyRequest) returns (APIKey) {
    option (google.api.http) = { get: "/v1/server/api-keys/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }

  // 更新 key 治理字段（T-02）：可改 name/scopes/enabled/expire_at；
  // secret 无原地轮换——平滑轮换 = 新建 key + 双 key 并存过渡 + 旧 key
  // 经本方法设 expire_at 下线（见 09-api-guide.md 轮换流程）。禁用/过期
  // 立即生效（每请求鉴权读库校验）。
  rpc UpdateAPIKey(UpdateAPIKeyRequest) returns (APIKey) {
    option (google.api.http) = { patch: "/v1/server/api-keys/{id}", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }

  rpc DeleteAPIKey(GetAPIKeyRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/api-keys/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }

  // WhoAmI 返回调用凭证（X-API-Key）自身对应的 key 行（whoami）。
  //
  // 认证形态为"自证凭证型"（ACCESS_PUBLIC + 不要求任何 scope）：出示 key
  // 明文本身就是查询授权——任何有效 key 可查自己，零信息泄露、零自铸面；
  // 不要求 scope 意味着零 scope key 也可用。无效/禁用/过期/删除 → 401
  // （每请求读库校验，与请求侧认证同路径）；匿名/非 API key 凭证（admin
  // 会话等）无可述的 key，handler 返回 401。
  // 响应不含 secret（永不回显）；max_age_seconds 由服务端以服务器时钟计算
  // （相对时间，规避客户端时钟偏斜）。
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {
    option (google.api.http) = { get: "/v1/server/api-keys/whoami" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }
}

message CreateAPIKeyRequest {
  string name = 1;
  repeated string scopes = 2;
  // 过期时间；不设置 = 永不过期（RFC3339，经 gateway 序列化为字符串）。
  optional google.protobuf.Timestamp expire_at = 3;
}

message UpdateAPIKeyRequest {
  string id = 1;
  // 以下字段 proto3 optional：未设置 = 不修改；设置（含 enabled=false）= 更新。
  optional string name = 2;
  repeated string scopes = 3;
  optional bool enabled = 4;
  // 新过期时间；设置 = 更新（不提供"清除过期"语义——永不过期请删除重建）。
  optional google.protobuf.Timestamp expire_at = 5;
}

message GetAPIKeyRequest {
  string id = 1;
}

message ListAPIKeysResponse {
  repeated APIKey api_keys = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message APIKeyWithSecret {
  APIKey api_key = 1;
  // 明文 API key secret，仅创建响应返回一次，之后任何接口不再回显
  // （持久层仅存哈希；泄露需删除重建）。
  string secret = 2;
}

message APIKey {
  string id = 1;
  string name = 2;
  repeated string scopes = 3;
  bool enabled = 4;
  google.protobuf.Timestamp expire_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  // key 唯一 ID（非显示名：审计/归因/allow 列表按本 ID 匹配）。
  string key_id = 1;
  // key 显示名。
  string name = 2;
  // key 所属 project id。当前数据模型 key 恒绑定项目（api_keys.project_id
  // NOT NULL）；平台级 key（空 project）需 schema 迁移，暂未支持。
  string project_id = 3;
  // 该 key 的 scope 列表原样：TW 内建词表形态 + `<service>.<name>` 自定义
  // 语法（TW 只存不解释，语义归各服务）。
  repeated string scopes = 4;
  // 服务端计算：key 设了 expire_at → max(0, expire_at - now) 秒；未设置 = 0。
  // 相对时间规避客户端/服务端时钟偏斜。已过期 key 不会到达本方法（认证层
  // 即 401），此处钳 0 为防御。
  int64 max_age_seconds = 5;
}
