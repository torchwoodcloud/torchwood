syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service OAuthProvidersService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_SERVER };

  rpc ListOAuthProviders(shared.v1.ListRequest) returns (ListOAuthProvidersResponse) {
    option (google.api.http) = { get: "/v1/server/oauth-providers" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_OAUTH_PROVIDERS, op: SCOPE_OP_READ }
    };
  }

  rpc UpsertOAuthProvider(UpsertOAuthProviderRequest) returns (OAuthProvider) {
    option (google.api.http) = {
      put: "/v1/server/oauth-providers/{provider}"
      body: "*"
    };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_OAUTH_PROVIDERS, op: SCOPE_OP_WRITE }
    };
  }

  rpc DeleteOAuthProvider(DeleteOAuthProviderRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/oauth-providers/{provider}" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_OAUTH_PROVIDERS, op: SCOPE_OP_WRITE }
    };
  }
}

message ListOAuthProvidersResponse {
  repeated OAuthProvider oauth_providers = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message UpsertOAuthProviderRequest {
  string provider = 1;
  bool enabled = 2;
  string client_id = 3;
  // OAuth client secret：仅写入（Upsert）时接受；响应不回显（OAuthProvider
  // 仅返回 has_client_secret 布尔）。optional：未设置 = 保持现有 secret 不变；
  // 设置为非空串 = 轮换为新值；空串 = 不允许清空（服务端按"保持不变"处理）。
  optional string client_secret = 4;
  repeated string scopes = 5;
}

message DeleteOAuthProviderRequest {
  string provider = 1;
}

message OAuthProvider {
  string provider = 1;
  bool enabled = 2;
  string client_id = 3;
  bool has_client_secret = 4;
  repeated string scopes = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
