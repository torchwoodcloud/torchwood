syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "The project is bound to the API key row; X-Torchwood-Project is not needed. This header is only for Console admin sessions switching projects."
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid> (Console admin session)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// FunctionsService 管理 Functions v4 的函数与调用（docs/design/functions-v4.md）：
// 函数 = 常驻服务（endpoint target），torchwood 只做路由、身份、记账与投递
// ——执行面（打包/构建/部署/池/运行时/变量）已整体外包，归 fleetly CLI 或
// 用户自有工具链。一次调用统一为 invocation（v4 §2 重命名：CreateExecution →
// InvokeFunction / executions → invocations）。
service FunctionsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // CreateFunction 创建函数：endpoint target（url）创建时录入，签名密钥
  // 服务端生成、明文仅在本响应出现一次（之后只出指纹）。
  rpc CreateFunction(CreateFunctionRequest) returns (CreateFunctionResponse) {
    option (google.api.http) = { post: "/v1/server/functions", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
  rpc ListFunctions(shared.v1.ListRequest) returns (ListFunctionsResponse) {
    option (google.api.http) = { get: "/v1/server/functions" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "functions", op: SCOPE_OP_READ }
    };
  }
  rpc GetFunction(GetFunctionRequest) returns (Function) {
    option (google.api.http) = { get: "/v1/server/functions/{function_id}" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "functions", op: SCOPE_OP_READ }
    };
  }
  rpc UpdateFunction(UpdateFunctionRequest) returns (Function) {
    option (google.api.http) = { patch: "/v1/server/functions/{function_id}", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
  rpc DeleteFunction(GetFunctionRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/functions/{function_id}" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
  // InvokeFunction 调用一个函数（v4 §2：CreateExecution 改名——一个动作一个
  // 名字，与 client 面同名对齐；async=true 时立即返回 queued invocation）。
  rpc InvokeFunction(InvokeFunctionRequest) returns (Invocation) {
    option (google.api.http) = { post: "/v1/server/functions/{function_id}:invoke", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
  rpc ListInvocations(ListInvocationsRequest) returns (ListInvocationsResponse) {
    option (google.api.http) = { get: "/v1/server/functions/{function_id}/invocations" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "functions", op: SCOPE_OP_READ }
    };
  }
  rpc GetInvocation(GetInvocationRequest) returns (Invocation) {
    option (google.api.http) = { get: "/v1/server/functions/{function_id}/invocations/{invocation_id}" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "functions", op: SCOPE_OP_READ }
    };
  }
  // SetFunctionScopes 全量替换函数 declared_scopes（P0 执行身份）。独立 RPC
  // 而非并入 UpdateFunctionRequest：repeated 字段无法表达「未设置=不修改」
  // 的 presence 语义（proto 规范：更新类可选字段用 proto3 optional）。
  rpc SetFunctionScopes(SetFunctionScopesRequest) returns (Function) {
    option (google.api.http) = { put: "/v1/server/functions/{function_id}/scopes", body: "*" };
    // 镜像敏感方法显式声明 method_auth 先例（R10-P1-1）。
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
  // RotateFunctionSecret 轮换 endpoint target 签名密钥（v4 §3/§4，语义与
  // webhooks RotateWebhookSecret 一致）：新钥即刻生效（v1 签名），旧钥保留
  // 一个宽限窗（v2 双签）——函数侧持旧钥的 FDK 过渡期不断流。新明文仅在
  // 本响应出现一次。
  rpc RotateFunctionSecret(RotateFunctionSecretRequest) returns (FunctionSecret) {
    option (google.api.http) = { post: "/v1/server/functions/{function_id}:rotate-secret", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }

  // ——触发器管理（P1 触发器模块；K4/K10）——
  //
  // CreateFunctionTrigger 创建 HTTP / cron / event 触发器。http 的 token 由
  // 服务端生成（128bit，URL 即鉴权）、不收入参；公开调用路由为
  // /f/{project_id}/{token}（FunctionTrigger.invoke_path）。
  rpc CreateFunctionTrigger(CreateFunctionTriggerRequest) returns (FunctionTrigger) {
    option (google.api.http) = { post: "/v1/server/functions/{function_id}/triggers", body: "*" };
    // 镜像 SetFunctionScopes 先例：functions.write + admin/owner。
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
  rpc ListFunctionTriggers(GetFunctionRequest) returns (ListFunctionTriggersResponse) {
    option (google.api.http) = { get: "/v1/server/functions/{function_id}/triggers" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "functions", op: SCOPE_OP_READ }
    };
  }
  rpc DeleteFunctionTrigger(DeleteFunctionTriggerRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/functions/{function_id}/triggers/{trigger_id}" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
  // RotateFunctionTriggerToken 轮换 http 触发器 token（URL 含 token 会被
  // 代理/访问日志记录；轮换后旧 token 立即失效），返回带新 token 的触发器。
  rpc RotateFunctionTriggerToken(RotateFunctionTriggerTokenRequest) returns (FunctionTrigger) {
    option (google.api.http) = { post: "/v1/server/functions/{function_id}/triggers/{trigger_id}:rotate-token", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "functions", op: SCOPE_OP_WRITE }
    };
  }
}

// Function 是函数视图。v4 target 模型（§3）：执行位置 = endpoint 常驻服务；
// 池策略/运行时/资源规格归 substrate（fleetly 副本数 / k8s HPA / 用户自管），
// 字段号与名称 retired（见 reserved）。
message Function {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // runtime（字段 4）/ entrypoint（字段 5）已退役（v4 执行面外包：运行时与
  // 入口归部署侧；proto 纪律：号段与名称封存，永不复用）。
  reserved 4, 5;
  reserved "runtime", "entrypoint";
  int32 timeout_seconds = 6;
  // spec（字段 7）已退役：资源规格归 substrate。
  reserved 7;
  reserved "spec";
  bool enabled = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // 函数执行 principal 的平台访问声明（P0 执行身份）：每项形如
  // "<resource>:<op>"（如 "assets:write"），词表见
  // docs/developer/08-functions.md「执行身份」；空集 = 无平台访问权限
  // （fail-closed 默认）。管理经 SetFunctionScopes 全量替换。
  repeated string declared_scopes = 11;
  // ——客户端调用面策略（P2，设计 §4）——
  bool client_callable = 12;
  // 字段保留、一期禁用：置 true 会被服务端显式拒绝（Q4 拍板：匿名 IP 兜底
  // 限频做好后再开）。
  bool client_anonymous_allowed = 13;
  // 每用户限频配额（client_limit_window 窗口内）；client_callable=true
  // 要求 >= 1。
  int32 client_per_user_limit = 14;
  // 限频窗口：minute | hour | day（day 按 UTC 日期）。
  string client_limit_window = 15;
  // ——池策略五字段（字段 16-20）已退役（v4 §3：池策略归 substrate）——
  reserved 16, 17, 18, 19, 20;
  reserved "min_instances", "max_instances", "idle_ttl_seconds",
      "max_requests_per_instance", "concurrency";
  // endpoint target（v4 §3 单一 endpoint kind；proto 留 fleetly kind 扩展位
  // ——仅当需要原生 warm invoke/指标透出时立项，v4 不实现）。
  FunctionTarget target = 21;
}

// FunctionTarget 是函数的执行终点（v4 §3 单一 endpoint target 模型）。
// 密钥任何形态不回显：明文仅在创建/轮换响应一次性返回（实施勘误 2026-10-15：
// 签名方每次调用需明文计算 HMAC——密钥本体 secretbox 加密落库，API 面只出
// 指纹），管理面只出 secret_fingerprint。
message FunctionTarget {
  // 函数常驻服务的调用终点（生产强制 https；开发环境经 app 层放行 http）。
  string url = 1;
  // 签名密钥指纹（"twfnsec_" + SHA-256 前 8 hex；比对用，非明文）。
  string secret_fingerprint = 2;
  // 最近一次密钥轮换时刻（宽限窗内旧钥 v2 双签）。
  google.protobuf.Timestamp secret_rotated_at = 3;
}

// Invocation 是一次函数调用记录（v4 §2：Execution 改名——torchwood 只发起
// 调用、不执行）。stdout/stderr 已退役：日志归 substrate 侧（fleetly logs /
// 用户服务自管），torchwood 只见网关往返结果。
message Invocation {
  string id = 1;
  string function_id = 2;
  // deployment_id（字段 3）已退役：部署面随执行面外包消解。
  reserved 3;
  reserved "deployment_id";
  // queued | running | completed | failed（v4 收敛：building 态随补构建退役）。
  string status = 4;
  string response = 5;
  // stdout/stderr（字段 6/7）已退役：日志归 substrate 侧。
  reserved 6, 7;
  reserved "stdout", "stderr";
  int32 status_code = 8;
  int64 duration_ms = 9;
  string error = 10;
  bool response_truncated = 11;
  // stdout_truncated/stderr_truncated（字段 12/13）已退役（同 stdout/stderr）。
  reserved 12, 13;
  reserved "stdout_truncated", "stderr_truncated";
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message CreateFunctionRequest {
  // 客户端自选 function_id；functions:invoke / functions:rotate-secret
  // 为自定义方法段（REST 自定义动词），不占用 function_id 命名空间，
  // 可自由取任意合法值。
  string id = 1;
  string name = 2;
  // runtime（字段 3）/ entrypoint（字段 4）已退役（v4 执行面外包）。
  reserved 3, 4;
  reserved "runtime", "entrypoint";
  optional int32 timeout_seconds = 5;
  // spec（字段 6）已退役：资源规格归 substrate。
  reserved 6;
  reserved "spec";
  optional bool enabled = 7;
  // 执行身份声明（P0）：词表校验/去重在服务端（app 层），空集合法。
  repeated string declared_scopes = 8;
  // ——客户端调用面策略（P2，设计 §4）——
  optional bool client_callable = 9;
  // 字段保留、一期禁用：置 true 显式报错「一期未开放」。
  optional bool client_anonymous_allowed = 10;
  // client_callable=true 时必须 >= 1。
  optional int32 client_per_user_limit = 11 [(buf.validate.field).int32.gte = 0];
  optional string client_limit_window = 12 [(buf.validate.field).string = { in: ["minute", "hour", "day"] }];
  // endpoint target url（v4 §3）：函数常驻服务的调用终点。生产强制 https
  //（开发环境可放行 http，校验在服务端 app 层按环境裁决）。
  string target_url = 13 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = { min_len: 9, max_len: 2048 }
  ];
  // 可选自定义签名密钥（twfnsec_ 前缀；空 = 服务端生成）。两种来源都只在
  // 本请求出现一次，落库前加密。
  optional string target_secret = 14 [(buf.validate.field).string.min_len = 16];
}

// CreateFunctionResponse 是创建响应：函数视图 + 一次性 target 签名密钥明文
//（仅此一次；之后任何面只出指纹）。
message CreateFunctionResponse {
  Function function = 1;
  // target 签名密钥明文（服务端生成或透传录入值）。之后只出指纹。
  string target_secret = 2;
}

message UpdateFunctionRequest {
  string function_id = 1;
  optional string name = 2;
  // entrypoint（字段 3）已退役（v4 执行面外包）。
  reserved 3;
  reserved "entrypoint";
  optional int32 timeout_seconds = 4;
  // spec（字段 5）已退役：资源规格归 substrate。
  reserved 5;
  reserved "spec";
  optional bool enabled = 6;
  // ——客户端调用面策略（P2，设计 §4；未设置 = 不修改）——
  optional bool client_callable = 7;
  // 字段保留、一期禁用：置 true 显式报错「一期未开放」。
  optional bool client_anonymous_allowed = 8;
  optional int32 client_per_user_limit = 9 [(buf.validate.field).int32.gte = 0];
  optional string client_limit_window = 10 [(buf.validate.field).string = { in: ["minute", "hour", "day"] }];
  // ——池策略五字段（字段 11-15）与 runtime（字段 16）已退役（v4 §3）——
  reserved 11, 12, 13, 14, 15, 16;
  reserved "min_instances", "max_instances", "idle_ttl_seconds",
      "max_requests_per_instance", "concurrency", "runtime";
  // endpoint target url（v4 §3）：未设置 = 不修改；密钥变更走
  // RotateFunctionSecret（与 webhooks Update/Rotate 分工一致）。
  optional string target_url = 17 [
    (buf.validate.field).string = { min_len: 9, max_len: 2048 }
  ];
}

message GetFunctionRequest {
  string function_id = 1;
}

// RotateFunctionSecretRequest 轮换 endpoint target 签名密钥。
message RotateFunctionSecretRequest {
  string function_id = 1 [(buf.validate.field).required = true];
}

// FunctionSecret 是轮换响应：明文只出现这一次，调用方立即部署到函数侧。
message FunctionSecret {
  string function_id = 1;
  // 签名密钥明文（twfnsec_ 前缀 + 32 字节 base64url）。之后只出指纹。
  string secret = 2;
  // 轮换后的指纹（便于与既有记录核对）。
  string secret_fingerprint = 3;
}

// InvokeFunctionRequest 调用一个函数（v4 §2：CreateExecutionRequest 改名；
// deployment_id 已随部署面退役——目标恒为函数当前的 endpoint target）。
message InvokeFunctionRequest {
  string function_id = 1;
  // deployment_id（字段 2）已退役：部署面随执行面外包消解。
  reserved 2;
  reserved "deployment_id";
  string data = 3;
  optional bool async = 4;
}

// SetFunctionScopesRequest 全量替换函数 declared_scopes（P0 执行身份；
// 空集 = 撤销全部平台访问）。
message SetFunctionScopesRequest {
  string function_id = 1;
  repeated string declared_scopes = 2;
}

// GetInvocationRequest 按 id 寻址调用记录。
message GetInvocationRequest {
  string function_id = 1;
  string invocation_id = 2;
}

// ——触发器管理（P1）——

// CreateFunctionTriggerRequest 创建触发器：type 选择 http / cron / event，
// 三选一填 http / cron / event 配置段。token 服务端生成，不收入参。
message CreateFunctionTriggerRequest {
  string function_id = 1 [(buf.validate.field).required = true];
  // 触发器类型：http | cron | event（大小写敏感）。
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = { in: ["http", "cron", "event"] }
  ];
  // type=http 时必填。
  HttpTriggerConfig http = 3;
  // type=cron 时必填。
  CronTriggerConfig cron = 4;
  // type=event 时必填（v3 切片 D，functions-v3.md §4.1）。
  EventTriggerConfig event = 5;
}

// HttpTriggerConfig 是 HTTP 触发器配置。
message HttpTriggerConfig {
  // 双响应模式（二轮复审：微信 SSV 回调 1s 超时，纯同步大概率超时丢事件）：
  //   sync      同步执行（≤30s）并透传函数响应；
  //   async_ack 立即 200 + ack_body，函数走异步队列（200 是「已受理」语义）。
  string response_mode = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = { in: ["sync", "async_ack"] }
  ];
  // async_ack 模式下的 200 响应体（≤1KB，防带宽放大）；sync 模式忽略。
  optional string ack_body = 2 [(buf.validate.field).string.max_len = 1024];
  // GET 握手：echo = 平台直接回 {"echostr": <query.echostr>}，不 invoke。
  // 空 = GET 一律 405。
  optional string handshake = 3 [(buf.validate.field).string = { in: ["echo"] }];
  // 请求体上限（字节）：缺省 65536（64KB），上限 1048576（1MB）。
  optional int32 body_limit_bytes = 4 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 1048576
  ];
}

// CronTriggerConfig 是 cron 触发器配置（K10：一期 UTC）。
message CronTriggerConfig {
  // 5 字段 cron 表达式（分 时 日 月 周，UTC；支持 * , - / 数字；周 0-7 且
  // 7=0）。解析校验在服务端（领域层 cronexpr）。
  string expr = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 9,
    (buf.validate.field).string.max_len = 64
  ];
  // 错过策略：skip（只推进不补跑）| catch_up_once（补跑一次；默认）。
  string misfire = 2 [(buf.validate.field).string = { in: ["skip", "catch_up_once"] }];
}

// EventTriggerConfig 是事件触发器配置（v3 切片 D，functions-v3.md §4.1/D12
// + §4.1 增补）。订阅串双形态：
//   文档写事件（业界同构）：
//     databases.{database_id}.collections.{collection_id}.documents.{op}
//   op ∈ {create, update, delete, *}；collection 段可为 `*`；database 段一期
//   必须精确（database 级通配后置）。
//   系统行为事件（§4.1 增补）：
//     {domain}.* | {domain}.{resource}.* | {domain}.{resource}.{op}（精确全名）
//   域词表 = 平台系统事件目录（auth / payments / economy / subscriptions，
//   唯一声明源 internal/domain/events/catalog.go，如 auth.users.created、
//   payments.orders.paid）；`*` 仅允许尾段；目录内无命中的前缀直接拒绝
//   （fail-closed，拼错立刻 400）。格式校验在服务端（领域层 eventmatch）。
// 自环警告（D13）：订阅本函数自身写入的集合会形成「写→事件→再触发」循环，
// 平台一期不做硬防护，Console 编辑处文案警告。
message EventTriggerConfig {
  // 订阅串列表（1..64 条，单条 ≤200 字节；服务端逐条格式校验）。
  repeated string events = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.max_len = 200
  ];
}

// FunctionTrigger 是触发器视图。http 专有字段（token/invoke_path/response_mode/
// ack_body/handshake/body_limit_bytes）与 cron 专有字段（expr/misfire/
// next_run_at）按 type 取用；token 明文仅在管理面返回。
message FunctionTrigger {
  string id = 1;
  string function_id = 2;
  string type = 3;
  bool enabled = 4;
  // ——http——
  string response_mode = 5;
  string ack_body = 6;
  string handshake = 7;
  int32 body_limit_bytes = 8;
  string token = 9;
  // 公开调用路径 /f/{project_id}/{token}（host 侧自行拼接）。
  string invoke_path = 10;
  // ——cron——
  string expr = 11;
  string misfire = 12;
  google.protobuf.Timestamp next_run_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // ——event——订阅串列表（type=event 时非空）。
  repeated string events = 16;
}

message ListFunctionTriggersResponse {
  repeated FunctionTrigger triggers = 1;
}

message DeleteFunctionTriggerRequest {
  string function_id = 1 [(buf.validate.field).required = true];
  string trigger_id = 2 [(buf.validate.field).required = true];
}

message RotateFunctionTriggerTokenRequest {
  string function_id = 1 [(buf.validate.field).required = true];
  string trigger_id = 2 [(buf.validate.field).required = true];
}

message ListFunctionsResponse {
  repeated Function functions = 1;
  shared.v1.ListResponseMeta meta = 2;
}

// ListInvocationsRequest 分页拉取调用记录（排障面：status 精确 + created_at
// 闭区间过滤，结构化字段沿 audit-logs 先例）。
message ListInvocationsRequest {
  string function_id = 1 [(buf.validate.field).required = true];
  int32 page_size = 2 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  string page_token = 3 [(buf.validate.field).string.max_len = 4096];
  // 调用状态精确匹配：queued | running | completed | failed。
  string status = 4 [(buf.validate.field).string.max_len = 16];
  google.protobuf.Timestamp created_after = 5;
  google.protobuf.Timestamp created_before = 6;
}

message ListInvocationsResponse {
  repeated Invocation invocations = 1;
  shared.v1.ListResponseMeta meta = 2;
}
