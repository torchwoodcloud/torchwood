syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";
import "shared/v1/leaderboard.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "The project is bound to the API key row; X-Torchwood-Project is not needed. This header is only for Console admin sessions switching projects."
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid> (Console admin session)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// LeaderboardsService 是排行榜 server 面（dogfooding 提案 2026-09-11）：
// 代任意 subject 提交 + 快照/榜读。提交窗口 = {当前期, 上一期}，封榜后对
// 所有人（含本面）拒收——封榜即终局。
service LeaderboardsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc SubmitLeaderboardScore(SubmitLeaderboardScoreRequest) returns (shared.v1.LeaderboardScoreSnapshot) {
    option (google.api.http) = { post: "/v1/server/leaderboards/{board_id}:submit", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_WRITE }
    };
  }
  rpc GetLeaderboardEntry(GetLeaderboardEntryRequest) returns (shared.v1.LeaderboardScoreSnapshot) {
    option (google.api.http) = { get: "/v1/server/leaderboards/{board_id}/entries/{subject_id}" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_READ }
    };
  }
  rpc ListLeaderboardTop(ListLeaderboardTopRequest) returns (shared.v1.ListLeaderboardTopResponse) {
    option (google.api.http) = { get: "/v1/server/leaderboards/{board_id}/top" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_READ }
    };
  }

  // —— Phase 2：结算读（发奖明细 = 用户资产 ledger 的 leaderboard_settlement
  // 引用视图；写操作只有 worker 与 console）——
  rpc GetLeaderboardSettlement(GetLeaderboardSettlementRequest) returns (GetLeaderboardSettlementResponse) {
    option (google.api.http) = { get: "/v1/server/leaderboards/{board_id}/settlements/{period}" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_READ }
    };
  }
  rpc ListLeaderboardSettlements(ListLeaderboardSettlementsRequest) returns (ListLeaderboardSettlementsResponse) {
    option (google.api.http) = { get: "/v1/server/leaderboards/{board_id}/settlements" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_READ }
    };
  }

  // —— board 配置管控（graviton-games 提案 2026-09-13，评审裁决）：预置与
  // 门禁自动化的控制面。写动词（Create/Update）走 leaderboards.admin——
  // 与 leaderboards.write 刻意分离：能提交分值的密钥不得改榜配置。Delete
  // 不进 server 面（条目级联删的破坏性操作留给 console owner 双确认）；
  // rewards 不在 Create/Update 消息内（奖励规则编辑仅 console owner）。
  // Create 幂等：已存在且配置逐字段相等（缺省归一后）→ 200 + 现状；
  // 不等 → ALREADY_EXISTS（附字段 diff）。
  rpc CreateLeaderboardBoard(CreateLeaderboardBoardRequest) returns (shared.v1.LeaderboardBoard) {
    option (google.api.http) = { post: "/v1/server/leaderboards/boards", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_ADMIN }
    };
  }
  rpc GetLeaderboardBoard(GetLeaderboardBoardRequest) returns (shared.v1.LeaderboardBoard) {
    option (google.api.http) = { get: "/v1/server/leaderboards/boards/{board_id}" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_READ }
    };
  }
  rpc ListLeaderboardBoards(ListLeaderboardBoardsRequest) returns (ListLeaderboardBoardsResponse) {
    option (google.api.http) = { get: "/v1/server/leaderboards/boards" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_READ }
    };
  }
  rpc ListLeaderboardBoardPeriods(ListLeaderboardBoardPeriodsRequest) returns (ListLeaderboardBoardPeriodsResponse) {
    option (google.api.http) = { get: "/v1/server/leaderboards/boards/{board_id}/periods" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_READ }
    };
  }
  rpc UpdateLeaderboardBoard(UpdateLeaderboardBoardRequest) returns (shared.v1.LeaderboardBoard) {
    option (google.api.http) = { patch: "/v1/server/leaderboards/boards/{board_id}", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "leaderboards", op: SCOPE_OP_ADMIN }
    };
  }
}

// SubmitLeaderboardScoreRequest：server 面可代任意 subject 提交（函数/
// 运营/自动化）。request_id 走 (project, actor, request_id) 24h 幂等——
// 网络层重试不重复烧 per-subject 限频额度。
message SubmitLeaderboardScoreRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string subject_id = 2 [(buf.validate.field).required = true];
  int64 value = 3;
  optional int64 tiebreak_value = 4;
  // 缺省 = 当前期；显式必须命中 {当前期, 上一期}（离线补传宽限）
  string period = 5;
  string request_id = 6;
}

message GetLeaderboardEntryRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string subject_id = 2 [(buf.validate.field).required = true];
  string period = 3;
}

message ListLeaderboardTopRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string period = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = { gte: 0, lte: 100 }];
  string page_token = 4;
}

message GetLeaderboardSettlementRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string period = 2 [(buf.validate.field).required = true];
}

message GetLeaderboardSettlementResponse {
  shared.v1.LeaderboardSettlement settlement = 1;
  repeated shared.v1.LeaderboardSettlementGrant grants = 2;
}

message ListLeaderboardSettlementsRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  int32 limit = 2 [(buf.validate.field).int32 = { gte: 0, lte: 200 }];
}

message ListLeaderboardSettlementsResponse {
  repeated shared.v1.LeaderboardSettlement settlements = 1;
}

// CreateLeaderboardBoardRequest 与 console 同形去掉 rewards（评审裁决：奖励
// 规则编辑仅 console owner，server 面消息不含 rewards，重放比较集亦不含）。
message CreateLeaderboardBoardRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = { pattern: "^[a-z_][a-z0-9_]*$", max_len: 40 }
  ];
  // asc | desc（缺省 desc）
  string sort = 2;
  // 声明单列 tiebreak 及方向（asc | desc）；缺省不声明
  string tiebreak_order = 3;
  // parallel | earliest | latest（缺省 parallel）
  string tie_break = 4;
  // none | daily | weekly | monthly（缺省 none）
  string period_kind = 5;
  string period_tz = 6;
  // best | latest | sum（缺省 best）
  string policy = 7;
  optional int64 value_min = 8;
  optional int64 value_max = 9;
  bool client_submit = 10;
  // 每期每主体提交次数上限（缺省 100，1..10000）
  int32 per_subject_submit_limit = 11;
  int32 retention_periods = 12;
  string subject_kind = 13;
}

message ListLeaderboardBoardsRequest {}

message ListLeaderboardBoardsResponse {
  repeated shared.v1.LeaderboardBoard boards = 1;
}

message GetLeaderboardBoardRequest {
  string board_id = 1 [(buf.validate.field).required = true];
}

// UpdateLeaderboardBoardRequest 用 proto3 optional 表达"未设置 = 不修改"；
// 显式清空走 clear_* 布尔。period/sort/tiebreak 声明/policy/tie_break 在
// 榜内已有条目时不可改（FailedPrecondition，与 console 同一 domain 护栏）。
// 不含 rewards / clear_rewards。
message UpdateLeaderboardBoardRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  optional string sort = 2;
  optional string tiebreak_order = 3;
  bool clear_tiebreak = 4;
  optional string tie_break = 5;
  optional string period_kind = 6;
  optional string period_tz = 7;
  optional string policy = 8;
  optional int64 value_min = 9;
  optional int64 value_max = 10;
  bool clear_value_bounds = 11;
  optional bool client_submit = 12;
  optional int32 per_subject_submit_limit = 13;
  optional int32 retention_periods = 14;
  optional string subject_kind = 15;
}

message ListLeaderboardBoardPeriodsRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  int32 limit = 2 [(buf.validate.field).int32 = { gte: 0, lte: 200 }];
}

message ListLeaderboardBoardPeriodsResponse {
  repeated string periods = 1;
}
