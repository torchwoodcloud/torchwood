syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/leaderboard.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// LeaderboardsService 是排行榜 server 面（dogfooding 提案 2026-09-11）：
// 代任意 subject 提交 + 快照/榜读。提交窗口 = {当前期, 上一期}，封榜后对
// 所有人（含本面）拒收——封榜即终局。
service LeaderboardsService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_SERVER };

  rpc SubmitLeaderboardScore(SubmitLeaderboardScoreRequest) returns (shared.v1.LeaderboardScoreSnapshot) {
    option (google.api.http) = { post: "/v1/server/leaderboards/{board_id}:submit", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_LEADERBOARDS, op: SCOPE_OP_WRITE }
    };
  }
  rpc GetLeaderboardEntry(GetLeaderboardEntryRequest) returns (shared.v1.LeaderboardScoreSnapshot) {
    option (google.api.http) = { get: "/v1/server/leaderboards/{board_id}/entries/{subject_id}" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_LEADERBOARDS, op: SCOPE_OP_READ }
    };
  }
  rpc ListLeaderboardTop(ListLeaderboardTopRequest) returns (shared.v1.ListLeaderboardTopResponse) {
    option (google.api.http) = { get: "/v1/server/leaderboards/{board_id}/top" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_LEADERBOARDS, op: SCOPE_OP_READ }
    };
  }
}

// SubmitLeaderboardScoreRequest：server 面可代任意 subject 提交（函数/
// 运营/自动化）。request_id 走 (project, actor, request_id) 24h 幂等——
// 网络层重试不重复烧 per-subject 限频额度。
message SubmitLeaderboardScoreRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string subject_id = 2 [(buf.validate.field).required = true];
  int64 value = 3;
  optional int64 tiebreak_value = 4;
  // 缺省 = 当前期；显式必须命中 {当前期, 上一期}（离线补传宽限）
  string period = 5;
  string request_id = 6;
}

message GetLeaderboardEntryRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string subject_id = 2 [(buf.validate.field).required = true];
  string period = 3;
}

message ListLeaderboardTopRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string period = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = { gte: 0, lte: 100 }];
  string page_token = 4;
}
