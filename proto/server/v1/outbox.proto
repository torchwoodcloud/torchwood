syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// OutboxService 管理死信（W-J）。仅平台运维可读/重放，scope outbox:read/write。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "API key"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service OutboxService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_SERVER };

  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse) {
    option (google.api.http) = { get: "/v1/server/outbox/dead-letters" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_OUTBOX, op: SCOPE_OP_READ }
    };
  }

  rpc ReplayDeadLetter(ReplayDeadLetterRequest) returns (ReplayDeadLetterResponse) {
    option (google.api.http) = { post: "/v1/server/outbox/dead-letters/{event_id}:replay", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_OUTBOX, op: SCOPE_OP_WRITE }
    };
  }
}

// ListDeadLettersRequest 不携带 project_id（决策 v8 项目寻址不变量）：
// 项目上下文一律来自凭证——API key 取密钥行绑定，admin 会话必须携带
// X-Torchwood-Project 头（含平台 admin），否则 FailedPrecondition。
message ListDeadLettersRequest {
  int32 page_size = 2;
  string page_token = 3;
}

message DeadLetter {
  string event_id = 1;
  string project_id = 2;
  string topic = 3;
  string channel = 4;
  bytes payload = 5;
  int32 attempts = 6;
  string last_error = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListDeadLettersResponse {
  repeated DeadLetter dead_letters = 1;
  shared.v1.ListResponseMeta meta = 2;
}

// ReplayDeadLetterRequest 同上：项目上下文来自凭证，不做请求体寻址。
message ReplayDeadLetterRequest {
  string event_id = 1 [(buf.validate.field).required = true];
}

message ReplayDeadLetterResponse {
  string event_id = 1;
  google.protobuf.Timestamp available_at = 2;
}
