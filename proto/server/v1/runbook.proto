syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// RunbookService 是版本化资源迁移的状态面（docs/design/runbook.md §2.2，
// D2/D8/D9/D21）：只记录"哪些 step 已应用"的事实，不执行任何资源动作——
// 引擎在 CLI 侧，动作幂等 + 失败重跑（D7 无跨 RPC 事务，无 dirty 标记）。
// 状态是控制面表（迁移 000009），按项目隔离（项目上下文来自凭证）。
service RunbookService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_SERVER };

  // GetRunbookState 返回指定 runbook 的已应用 step 升序全集（空 = 未应用）。
  rpc GetRunbookState(GetRunbookStateRequest) returns (GetRunbookStateResponse) {
    option (google.api.http) = { get: "/v1/server/runbooks/{runbook}/steps" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_RUNBOOKS, op: SCOPE_OP_READ }
    };
  }

  // RecordRunbookStep 记录一个已应用的 step（CAS 语义，D8 并发防护）：
  // expect_prev_version 缺省/0 = 首步；不等于当前顶版 → FAILED_PRECONDITION
  // （并发双跑输家重拉状态收敛）。checksum = sha256(归一化后文件字节)（D9）。
  rpc RecordRunbookStep(RecordRunbookStepRequest) returns (RecordRunbookStepResponse) {
    option (google.api.http) = { post: "/v1/server/runbooks/{runbook}/steps", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_RUNBOOKS, op: SCOPE_OP_WRITE }
    };
  }

  // DeleteRunbookStep 摘除一个 step（down 回退 / forgive 逃生门 D21）：
  // 仅允许删除当前顶版（版本链单调），否则 FAILED_PRECONDITION。不执行
  // 任何资源动作——资源回退由调用方先完成再摘记录。
  rpc DeleteRunbookStep(DeleteRunbookStepRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/runbooks/{runbook}/steps/{version}" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_RUNBOOKS, op: SCOPE_OP_WRITE }
    };
  }
}

// RunbookStepState 是单条已应用记录的投影（物理寻址字段 project_id 不出）。
message RunbookStepState {
  int64 version = 1;
  // step 文件名去序号后的 name 段（NNNNNN_name.yaml）
  string name = 2;
  // sha256(归一化后文件字节)，小写十六进制
  string checksum = 3;
  google.protobuf.Timestamp applied_at = 4;
}

message GetRunbookStateRequest {
  string runbook = 1 [(buf.validate.field).string.max_len = 64];
}

// GetRunbookStateResponse 是升序全集（version ASC）。
message GetRunbookStateResponse {
  repeated RunbookStepState steps = 1;
}

// RecordRunbookStepRequest：字段号 3/4/5 为设计稿 §2.2 草案的撞号笔误修正
// （草案 name/version 同写 2；寻址键 runbook+version 对齐 Delete 消息的
// 1/2 编号，name/checksum/expect_prev_version 顺延）。
message RecordRunbookStepRequest {
  string runbook = 1 [(buf.validate.field).string.max_len = 64];
  int64 version = 2 [(buf.validate.field).int64.gte = 1];
  string name = 3 [(buf.validate.field).string = { pattern: "^[a-z0-9_]{1,64}$" }];
  string checksum = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  // CAS：缺省/0 = 断言无前序（首步）；显式值必须等于当前顶版。
  optional int64 expect_prev_version = 5;
}

message RecordRunbookStepResponse {
  // 记录成功后的当前顶版（= 本次 version）
  int64 current_version = 1;
}

message DeleteRunbookStepRequest {
  string runbook = 1 [(buf.validate.field).string.max_len = 64];
  int64 version = 2 [(buf.validate.field).int64.gte = 1];
}
