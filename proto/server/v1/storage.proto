syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/policy.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "The project is bound to the API key row; X-Torchwood-Project is not needed. This header is only for Console admin sessions switching projects."
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid> (Console admin session)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service StorageService {

  rpc CreateBucket(CreateBucketRequest) returns (Bucket) {
    option (google.api.http) = { post: "/v1/server/storage/buckets", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc ListBuckets(shared.v1.ListRequest) returns (ListBucketsResponse) {
    option (google.api.http) = { get: "/v1/server/storage/buckets" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc GetBucket(GetBucketRequest) returns (Bucket) {
    option (google.api.http) = { get: "/v1/server/storage/buckets/{id}" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:read"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc DeleteBucket(GetBucketRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/storage/buckets/{id}" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:write"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc UpdateBucket(UpdateBucketRequest) returns (Bucket) {
    option (google.api.http) = { patch: "/v1/server/storage/buckets/{id}", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:write"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc CreateFile(CreateFileRequest) returns (File) {
    option (google.api.http) = { post: "/v1/server/storage/buckets/{bucket_id}/files", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:write"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = { get: "/v1/server/storage/buckets/{bucket_id}/files" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:read"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc GetFile(GetFileRequest) returns (File) {
    option (google.api.http) = { get: "/v1/server/storage/buckets/{bucket_id}/files/{file_id}" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:read"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc DeleteFile(GetFileRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/storage/buckets/{bucket_id}/files/{file_id}" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:write"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc UpdateFile(UpdateFileRequest) returns (File) {
    option (google.api.http) = { patch: "/v1/server/storage/buckets/{bucket_id}/files/{file_id}", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:write"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc CreateFileToken(CreateFileTokenRequest) returns (FileToken) {
    option (google.api.http) = { post: "/v1/server/storage/buckets/{bucket_id}/files/{file_id}/tokens", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:write"] }
        }
        any_of: {
          require: { kind: "resource" values: ["storage:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc GetStorageUsage(GetStorageUsageRequest) returns (StorageUsage) {
    option (google.api.http) = { get: "/v1/server/storage/usage" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["storage:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

message CreateBucketRequest {
  // 逻辑桶显示名（服务端校验仅要求非空，与 app 层一致；不设字符集/长度约束）。
  string name = 1 [(buf.validate.field).required = true];
  repeated string permissions = 2;
  bool public = 3;
}

message GetBucketRequest {
  string id = 1;
}

message UpdateBucketRequest {
  string id = 1;
  optional string name = 2;
  optional bool public = 3;
}

message ListBucketsResponse {
  repeated Bucket buckets = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message Bucket {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool public = 6;
}

message CreateFileRequest {
  string bucket_id = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).required = true];
  // 客户端声明的 Content-Type；服务端不做形状校验——可执行/危险类型与空值
  // 一律归一化为 application/octet-stream（防存储型 XSS，见 app 层
  // normalizeMimeType），故此处不设 pattern 约束。
  string mime_type = 3;
  bytes data = 4;
  map<string, string> metadata = 5;
  // permissions 已废弃（A8）：原 repeated string permissions = 6 已迁 reserved，文件权限仅由 owner_user_id + bucket.Public 决定；勿复用字段号 6。
  reserved 6;
  reserved "permissions";
}

message ListFilesRequest {
  string bucket_id = 1;
  // 不支持：storage 面不消费查询过滤，携带即 InvalidArgument（服务端显式
  // 拒绝，不再静默忽略）。文件定位用 bucket_id 路径参数 + 分页。
  repeated string queries = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetFileRequest {
  string bucket_id = 1;
  string file_id = 2;
}

message ListFilesResponse {
  repeated File files = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message File {
  string id = 1;
  string bucket_id = 2;
  string name = 3;
  string mime_type = 4;
  int64 size = 5;
  map<string, string> metadata = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message UpdateFileRequest {
  string bucket_id = 1;
  string file_id = 2;
  // 以下字段为 optional（支持清空 name / mime_type）；metadata 为 map，
  // 空 map 表示不修改（清空语义未来 optional 化，属破坏性变更，需 SDK
  // /Console 同步后落地）。
  optional string name = 3;
  optional string mime_type = 4;
  map<string, string> metadata = 5;
}

message CreateFileTokenRequest {
  string bucket_id = 1;
  string file_id = 2;
  // 有效期秒数（1–3600）；未设置默认 900（15 分钟），上限对齐服务端
  // maxFileTokenLifetime = 3600（此前注释误写「默认 3600」——默认实为 900）。
  optional int64 expires_in = 3 [(buf.validate.field).int64 = { gt: 0, lte: 3600 }];
}

message FileToken {
  // 短期文件访问令牌（HMAC 签名）：仅创建响应返回一次，之后任何接口
  // 不回显；可拼接到下载 URL（?token=）匿名换取文件，过期/篡改返回 401。
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetStorageUsageRequest {}

message StorageUsage {
  int64 buckets = 1;
  int64 files = 2;
  int64 total_size = 3;
}
