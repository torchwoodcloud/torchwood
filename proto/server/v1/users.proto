syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "buf/validate/validate.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/policy.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "The project is bound to the API key row; X-Torchwood-Project is not needed. This header is only for Console admin sessions switching projects."
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid> (Console admin session)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service UsersService {

  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = { post: "/v1/server/users", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  // ListUsers 的 queries（shared.v1.ListRequest）是**静态表面 DSL**：经
  // ParseUserList 白名单解析（equal/greaterThan/lessThan + 白名单属性），
  // 独立于文档查询栈的单 typed AST——勿与 databases 的 Query 混用。
  rpc ListUsers(shared.v1.ListRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/v1/server/users" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = { get: "/v1/server/users/{id}" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = { patch: "/v1/server/users/{id}", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc UpdateUserPassword(UpdateUserPasswordRequest) returns (User) {
    option (google.api.http) = { patch: "/v1/server/users/{id}/password", body: "*" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc DeleteUser(GetUserRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/users/{id}" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc ListUserSessions(GetUserRequest) returns (ListUserSessionsResponse) {
    option (google.api.http) = { get: "/v1/server/users/{id}/sessions" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "principal_kind" values: ["admin"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:read"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc DeleteUserSession(DeleteUserSessionRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/users/{id}/sessions/{session_id}" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }

  rpc CreateUserToken(GetUserRequest) returns (CreateUserTokenResponse) {
    option (google.api.http) = { post: "/v1/server/users/{id}/tokens" };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: {
          require: { kind: "admin_role" values: ["member", "admin", "owner"] }
        }
        any_of: {
          require: { kind: "scope" values: ["users:write"] }
        }
      }
      exposure: EXPOSURE_PUBLIC
      label: "SERVER"
    };
  }
}

message GetUserRequest {
  string id = 1;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string status = 4;
  google.protobuf.Struct labels = 5;
  google.protobuf.Struct prefs = 6;
}

message UpdateUserRequest {
  string id = 1;
  // status/name/email 为 optional：未设置 = 不修改；设置（含空串）= 更新/清空。
  // labels/prefs 为 Struct：空对象 = 不修改（清空需置空对象键值，v2 再 optional 化）。
  // prefs 管理面为权威整体覆写（客户端 /v1/account/prefs 才是 merge 语义）。
  // name/avatar 校验与客户端面同口径（≤64 码点拒控制字符 / https ≤1024 字节）。
  optional string status = 2;
  google.protobuf.Struct labels = 3;
  google.protobuf.Struct prefs = 4;
  optional bool email_verified = 5;
  optional string name = 6 [(buf.validate.field).string = {
    max_len: 64,
    pattern: "^[^\x00-\x1f\x7f]*$"
  }];
  optional string email = 7;
  optional string avatar = 8 [(buf.validate.field).string = {
    max_bytes: 1024,
    pattern: "^($|https://)"
  }];
}

message UpdateUserPasswordRequest {
  string id = 1;
  string password = 2;
}

message DeleteUserSessionRequest {
  string id = 1;
  string session_id = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message ListUserSessionsResponse {
  repeated Session sessions = 1;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string status = 4;
  bool email_verified = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Struct labels = 8;
  google.protobuf.Struct prefs = 9;
  string phone = 10;
  // 对外展示头像（https URL）；注册默认空串。
  string avatar = 11;
}

message Session {
  string id = 1;
  string user_id = 2;
  string provider = 3;
  string user_agent = 4;
  string ip = 5;
  google.protobuf.Timestamp expire_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateUserTokenResponse {
  TokenBundle tokens = 1;
}

message TokenBundle {
  // 令牌明文：仅生成时返回一次，之后任何接口不再回显（持久层仅存哈希）。
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}
