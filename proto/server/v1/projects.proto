syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service ProjectsService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_SERVER };

  rpc CreateProject(CreateProjectRequest) returns (Project) {
    option (google.api.http) = { post: "/v1/server/projects", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "permission" }
      }
    };
  }

  rpc ListProjects(shared.v1.ListRequest) returns (ListProjectsResponse) {
    option (google.api.http) = { get: "/v1/server/projects" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_PROJECTS, op: SCOPE_OP_READ }
    };
  }

  rpc GetProject(GetProjectRequest) returns (Project) {
    option (google.api.http) = { get: "/v1/server/projects/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      api_key_scope: { resource: SCOPE_RESOURCE_PROJECTS, op: SCOPE_OP_READ }
    };
  }

  rpc UpdateProject(UpdateProjectRequest) returns (Project) {
    option (google.api.http) = { patch: "/v1/server/projects/{id}", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      admin_roles: [ADMIN_ROLE_MEMBER, ADMIN_ROLE_ADMIN, ADMIN_ROLE_OWNER]
      api_key_scope: { resource: SCOPE_RESOURCE_PROJECTS, op: SCOPE_OP_WRITE }
    };
  }

  rpc DeleteProject(GetProjectRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/projects/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "permission" }
      }
    };
  }

  // ---- 邀请码（T-03，invite_only 注册策略）----
  // 平台专属面（key 凭证禁入）：邀请码是注册凭证的逆向物，泄漏可绕过
  // 注册策略，故管理权仅 owner/admin console 会话。
  rpc CreateInviteCode(CreateInviteCodeRequest) returns (InviteCode) {
    option (google.api.http) = { post: "/v1/server/projects/{project_id}/invite-codes", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "permission" }
      }
    };
  }

  rpc ListInviteCodes(ListInviteCodesRequest) returns (ListInviteCodesResponse) {
    option (google.api.http) = { get: "/v1/server/projects/{project_id}/invite-codes" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "permission" }
      }
    };
  }

  // 吊销邀请码（软删：revoked_at 置位，消费路径立即拒绝）。
  rpc DeleteInviteCode(DeleteInviteCodeRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/projects/{project_id}/invite-codes/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "permission" }
      }
    };
  }

  // ---- OAuth 重定向白名单 ----
  // 平台专属面（key 凭证禁入）：白名单是 OAuth2 登录/魔法链接/恢复/验证等
  // 重定向流的可落点集合，篡改可用于钓鱼劫持端用户会话，管理权仅
  // owner/admin console 会话。
  rpc UpdateOAuthRedirectAllowlist(UpdateOAuthRedirectAllowlistRequest) returns (Project) {
    option (google.api.http) = {
      put: "/v1/server/projects/{project_id}/oauth-redirect-allowlist"
      body: "*"
    };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "permission" }
      }
    };
  }
}

message UpdateProjectRequest {
  string id = 1;
  optional string name = 2;         // 空值不修改（proto3 optional 表达 presence）
  optional string description = 3;
  // 注册策略（T-03）：open（默认，现状）/ invite_only（凭有效邀请码注册）/
  // closed（一律拒绝）；未设置 = 不修改。
  optional string registration_policy = 4;
}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
  // 必填；小写字母开头，仅小写字母与数字，最长 28（^[a-z][a-z0-9]{0,27}$）。
  string id = 3;
}

message UpdateOAuthRedirectAllowlistRequest {
  string project_id = 1 [(buf.validate.field).required = true];
  // 整表替换语义（PUT）：非空 = 替换为该列表；空 = 清空（回落默认白名单）。
  // 条目形状（http/https 绝对 URL、host 非空）由 app 层校验，长度/条数上限
  // 在此声明。
  repeated string urls = 2 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.max_len = 2048
  ];
}

message GetProjectRequest {
  string id = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message Project {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // 注册策略：open / invite_only / closed（T-03；默认 open）。
  string registration_policy = 7;
  // OAuth 重定向白名单（settings key auth.oauth_allowed_redirect_urls 的
  // 投影，仅投影该 key 不透出其余 settings）。空 = 未配置，回落默认白名单
  // （localhost 系列 + 本站 public_url origin）。
  repeated string oauth_allowed_redirect_urls = 8;
}

// ---- 邀请码（T-03）----
message CreateInviteCodeRequest {
  string project_id = 1;
  // 最大使用次数；不设置 = 1（一次性）。1..10000。
  optional int32 max_uses = 2;
  // 过期时间；不设置 = 永不过期。
  optional google.protobuf.Timestamp expire_at = 3;
}

message InviteCode {
  string id = 1;
  string project_id = 2;
  // 明文邀请码（twi_ 前缀随机串）。创建响应返回全量；列表亦回显
  //（邀请码是分发给被邀请者的明文凭证，管理端需可复制重发；
  // 泄露风险由一次性/次数上限/过期/可吊销控制）。
  string code = 3;
  int32 max_uses = 4;
  int32 used_count = 5;
  google.protobuf.Timestamp expire_at = 6;
  bool revoked = 7;
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListInviteCodesRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListInviteCodesResponse {
  repeated InviteCode invite_codes = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message DeleteInviteCodeRequest {
  string project_id = 1;
  string id = 2;
}
