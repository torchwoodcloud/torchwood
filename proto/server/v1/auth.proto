syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "buf/validate/validate.proto";
import "grpcapi/v1/authz.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "The project is bound to the API key row; X-Torchwood-Project is not needed. This header is only for Console admin sessions switching projects."
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid> (Console admin session)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// AuthService 是对外凭证校验面（token introspection，OAuth2 RFC 9660
// 模式）：把进程内凭证校验能力以 Server API 暴露，供桥接服务/Agent 在
// 建立连接前判定 Torchwood 签发凭证的有效性。判定语义与请求侧认证完全
// 一致（复用同一校验器），不引入第二套校验逻辑。
service AuthService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  // VerifyToken 校验 Torchwood 凭证原文并返回主体信息。
  //
  // 语义：
  // - 任何校验失败（过期/撤销/封禁/不存在/签名无效）→ valid=false + 200，
  //   不报错（introspection 契约）；仅基础设施故障返回 5xx。
  // - 凭证范围：端用户 access JWT 与项目 API key（sk- secret）。admin JWT、
  //   refresh token、一次性 JWT、函数执行 token 与端用户连接语义不符，
  //   一律 valid=false；一次性 token 只读判定、不消费。
  // - 项目边界：调用者（API key 恒绑定项目；admin 会话经 X-Torchwood-Project）
  //   与凭证分属不同项目时 valid=false；平台 admin 未选项目可跨项目校验。
  // - roles 为实时解析的角色词汇（不信任 JWT rls claim）：users /
  //   user:<id>[/verified] / group:<gid> / member:<mid> / group:<gid>/<role> /
  //   label:<l> 等。
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse) {
    option (google.api.http) = { post: "/v1/server/auth/tokens:verify", body: "*" };
    // 读面（TierReadOnly）：复用 users.read scope，不新增 scope 资源。
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "users", op: SCOPE_OP_READ }
    };
  }
}

// VerifyCredentialType 是调用方声明的凭证分派方式。
enum VerifyCredentialType {
  // AUTO：按结构分派——sk- 前缀走 API key，其余按端用户 JWT 验签。
  VERIFY_CREDENTIAL_TYPE_UNSPECIFIED = 0;
  VERIFY_CREDENTIAL_TYPE_AUTO = 1;
  // TOKEN：仅按端用户 access JWT 校验。
  VERIFY_CREDENTIAL_TYPE_TOKEN = 2;
  // API_KEY：仅按 API key secret（sha256 查表）校验。
  VERIFY_CREDENTIAL_TYPE_API_KEY = 3;
}

message VerifyTokenRequest {
  // Torchwood 凭证原文（端用户 access JWT 或 API key secret）。敏感字段：
  // 审计请求摘要按敏感字段名整值打码，不落原文。
  string token = 1 [(buf.validate.field).required = true];
  // 凭证分派方式，缺省 AUTO（protovalidate 的 enum defined_only 不默认
  // 开启，显式声明拒绝未定义枚举值）。
  VerifyCredentialType type = 2 [(buf.validate.field).enum = { defined_only: true }];
}

message VerifyTokenResponse {
  // false = 任何校验失败（过期/撤销/封禁/不存在/签名无效/跨项目）。
  // valid=false 时其余字段为零值，不泄露主体信息。
  bool valid = 1;
  // 端用户 id；API key 主体为空。
  string user_id = 2;
  // 端用户名（JWT usn claim，缺省回落 users 行 email）。
  string username = 3;
  // 凭证绑定的项目 id。
  string project_id = 4;
  // 端用户会话 id（活查会话表，登出即 invalid 的判定依据）。
  string session_id = 5;
  // 凭证到期时刻：JWT 为 exp；API key 为密钥行 expire_at（未设置则省略）。
  google.protobuf.Timestamp expires_at = 6;
  // 实时解析的角色词汇（与请求侧授权同源，不信任 JWT rls claim）。
  repeated string roles = 7;
  // 已接受（accepted）的组成员关系：每个 (group, role) 一条；无角色的
  // 成员关系 role 为空串。
  repeated GroupRef groups = 8;
  // 端用户 labels（与 label:<l> 角色同源）。
  repeated string labels = 9;
  // end_user / service。
  string actor_kind = 10;
  // API key 主体时为密钥行 id。
  string api_key_id = 11;
}

message GroupRef {
  string id = 1;
  string role = 2;
}
