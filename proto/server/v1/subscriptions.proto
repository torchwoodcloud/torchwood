syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/server/v1;serverv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "grpcapi/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "The project is bound to the API key row; X-Torchwood-Project is not needed. This header is only for Console admin sessions switching projects."
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid> (Console admin session)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "server" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// SubscriptionsService 是订阅管理面（v3 设计 §6）：Plan CRUD、订阅列表、
// 强制 Cancel/Expire。写方法 scope subscriptions.write（apiKeyScopeRules）
// 并登记 adminRoleMethodRules。
service SubscriptionsService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_SERVER };

  rpc CreatePlan(CreatePlanRequest) returns (SubscriptionPlan) {
    option (google.api.http) = { post: "/v1/server/subscriptions/plans", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["member", "admin", "owner"]
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_WRITE }
    };
  }
  rpc ListPlans(shared.v1.ListRequest) returns (ListPlansResponse) {
    option (google.api.http) = { get: "/v1/server/subscriptions/plans" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_READ }
    };
  }
  rpc GetPlan(GetPlanRequest) returns (SubscriptionPlan) {
    option (google.api.http) = { get: "/v1/server/subscriptions/plans/{plan_id}" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_READ }
    };
  }
  rpc UpdatePlan(UpdatePlanRequest) returns (SubscriptionPlan) {
    option (google.api.http) = { patch: "/v1/server/subscriptions/plans/{plan_id}", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["member", "admin", "owner"]
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_WRITE }
    };
  }
  rpc DeletePlan(DeletePlanRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/subscriptions/plans/{plan_id}" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["member", "admin", "owner"]
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_WRITE }
    };
  }

  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
    option (google.api.http) = { get: "/v1/server/subscriptions" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_READ }
    };
  }
  rpc GetSubscription(GetSubscriptionRequest) returns (Subscription) {
    option (google.api.http) = { get: "/v1/server/subscriptions/{subscription_id}" };
    option (grpcapi.v1.method_auth) = {
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_READ }
    };
  }
  rpc CancelSubscription(CancelSubscriptionRequest) returns (Subscription) {
    option (google.api.http) = { post: "/v1/server/subscriptions/{subscription_id}:cancel", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_WRITE }
    };
  }
  rpc ExpireSubscription(ExpireSubscriptionRequest) returns (Subscription) {
    option (google.api.http) = { post: "/v1/server/subscriptions/{subscription_id}:expire", body: "*" };
    option (grpcapi.v1.method_auth) = {
      admin_roles: ["admin", "owner"]
      api_key_scope: { resource: "subscriptions", op: SCOPE_OP_WRITE }
    };
  }
}

message BenefitGrant {
  string asset_code = 1;
  int64 quantity = 2;
  optional int64 expires_in = 3;
}

message BenefitEntitlement {
  string asset_code = 1;
  int32 tier = 2;
}

message Benefits {
  repeated BenefitGrant grants = 1;
  repeated BenefitEntitlement entitlements = 2;
}

message ProviderOverrides {
  string stripe_price_id = 1;
}

message SubscriptionPlan {
  string id = 1;
  string project_id = 2;
  string code = 3;
  string name = 4;
  int64 amount = 5;
  string currency = 6;
  string interval = 7;
  int64 interval_days = 8;
  int32 grace_days = 9;
  int32 trial_days = 10;
  Benefits benefits = 11;
  ProviderOverrides provider_overrides = 12;
  // active | archived
  string status = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message Subscription {
  string id = 1;
  string project_id = 2;
  string user_id = 3;
  string plan_id = 4;
  string plan_code = 5;
  string mode = 6;
  string provider = 7;
  string provider_sub_id = 8;
  string status = 9;
  google.protobuf.Timestamp current_period_start = 10;
  google.protobuf.Timestamp current_period_end = 11;
  bool cancel_at_period_end = 12;
  google.protobuf.Timestamp grace_until = 13;
  string billing_asset_code = 14;
  Benefits benefits = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message CreatePlanRequest {
  string code = 1;
  string name = 2;
  int64 amount = 3;
  string currency = 4;
  string interval = 5;
  int64 interval_days = 6;
  int32 grace_days = 7;
  int32 trial_days = 8;
  Benefits benefits = 9;
  ProviderOverrides provider_overrides = 10;
}

message GetPlanRequest {
  string plan_id = 1 [(buf.validate.field).required = true];
}

message UpdatePlanRequest {
  string plan_id = 1 [(buf.validate.field).required = true];
  optional string name = 2;
  optional int64 amount = 3;
  optional string currency = 4;
  optional string interval = 5;
  optional int64 interval_days = 6;
  optional int32 grace_days = 7;
  optional int32 trial_days = 8;
  Benefits benefits = 9;
  ProviderOverrides provider_overrides = 10;
  optional string status = 11;
}

message DeletePlanRequest {
  string plan_id = 1 [(buf.validate.field).required = true];
}

message ListPlansResponse {
  repeated SubscriptionPlan plans = 1;
  shared.v1.ListResponseMeta meta = 2;
}

// ListSubscriptionsRequest 结构化过滤（audit-logs 先例）：exact 匹配 + 时间闭
// 区间；分页按 created_at keyset 游标（page_token 由服务端签发），sort_order
// 控制方向（UNSPECIFIED = DESC；换向必须从第一页重来，异向游标即 InvalidArgument）。
message ListSubscriptionsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
  // 订阅用户 ID 精确匹配。
  string user_id = 3 [(buf.validate.field).string.max_len = 128];
  // 订阅状态精确匹配：trialing | active | past_due | canceled | expired。
  string status = 4 [(buf.validate.field).string.max_len = 16];
  google.protobuf.Timestamp created_after = 5;
  google.protobuf.Timestamp created_before = 6;
  // 时间列（created_at）排序方向；UNSPECIFIED = DESC（最新在前）。
  shared.v1.SortOrder sort_order = 7 [(buf.validate.field).enum.defined_only = true];
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message GetSubscriptionRequest {
  string subscription_id = 1 [(buf.validate.field).required = true];
}

message CancelSubscriptionRequest {
  string subscription_id = 1 [(buf.validate.field).required = true];
  string reason = 2;
}

message ExpireSubscriptionRequest {
  string subscription_id = 1 [(buf.validate.field).required = true];
  string reason = 2;
}
