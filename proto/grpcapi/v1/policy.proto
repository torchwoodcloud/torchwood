syntax = "proto3";

// Package grpcapi.v1 定义 API 策略、暴露面与路由装配声明。
//
// 路由的唯一事实源仍是 proto Service + google.api.http；本文件只声明
// 「方法要求什么、暴露到哪、文档标签是什么」，不声明凭证分类法。
package grpcapi.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/lynx-go/grpcapi/genproto/grpcapi/v1;grpcapiv1";

// APISpec 是文件级声明。
message APISpec {
  // API 面：public / internal / partner；空 = 默认面。
  string api = 1;
  // 策略 schema 版本；0 = 1，高于库支持版本即拒绝。
  uint32 schema_version = 2;
  // 可选的文件级默认策略/暴露面。
  Policy default_policy = 3;
  Exposure default_exposure = 4;
}

// ServiceSpec 是服务级缺省声明。
message ServiceSpec {
  Policy default_policy = 1;
  Exposure default_exposure = 2;
  // 文档/OpenAPI 的默认标签。
  string label = 3;
}

// MethodSpec 是方法级声明。
message MethodSpec {
  // 声明则默认完全覆盖 service/file 默认；inherit_default 时合并：
  // require/forbid 跨层 AND，any_of 各组并列为备选（组间恒为 OR）。
  Policy policy = 1;
  Exposure exposure = 2;
  // 文档/OpenAPI 的稳定标签；空 = 自动派生。
  string label = 3;
  // 可选，覆盖生成器的 operationId 约定。
  string operation_id = 4;
  // 仅元数据；幂等行为由可选 idempotency 模块提供。
  bool idempotent = 5;
  Deprecation deprecation = 6;
  // true = 与 service/file 默认合并：require/forbid 跨层 AND，any_of
  // 各组并入备选列表（组间恒为 OR）；false = 整体替换。
  bool inherit_default = 7;
  // 仅流式方法有效；默认 OPEN。
  StreamAuthMode stream_auth = 8;
}

// Deprecation 是 API 生命周期元数据。
message Deprecation {
  string since = 1;
  string sunset = 2;
  string replacement = 3;
}

// Policy 是有效授权策略的声明形态。
//
// 便捷糖（authenticated/roles/permissions/scopes）在构建期脱糖成
// Requirement；preset 在构建期展开。核心只认 Requirement 树。
message Policy {
  // 项目注册的命名策略；展开后与内联约束按 AND 合并。
  string preset = 1;
  map<string, string> preset_args = 2;

  // 显式匿名；与 require/any_of/糖字段互斥（forbid 可共存）。
  bool anonymous = 3;

  // 便捷糖。
  bool authenticated = 4;
  repeated string roles = 5;        // MATCH_ANY
  repeated string permissions = 6;  // MATCH_ALL
  repeated string scopes = 7;       // MATCH_ANY

  // 通用逃生口。
  repeated Requirement require = 8;
  repeated Alternative any_of = 9;
  repeated Requirement forbid = 10;
}

// Alternative 是 any_of 中的一个 AND 组。
message Alternative {
  bool authenticated = 1;
  repeated string roles = 2;
  repeated string permissions = 3;
  repeated string scopes = 4;
  repeated Requirement require = 5;
}

// Requirement 是策略树中的谓词。
message Requirement {
  string kind = 1;
  string vocabulary = 2;
  Match match = 3;
  repeated string values = 4;
  map<string, string> params = 5;
}

enum Match {
  MATCH_UNSPECIFIED = 0;
  MATCH_ANY = 1;
  MATCH_ALL = 2;
}

enum Exposure {
  EXPOSURE_UNSPECIFIED = 0;
  EXPOSURE_INTERNAL = 1;
  EXPOSURE_PUBLIC = 2;
  EXPOSURE_DEPRECATED = 3;
  EXPOSURE_HIDDEN = 4;
}

enum StreamAuthMode {
  STREAM_AUTH_MODE_UNSPECIFIED = 0;
  STREAM_AUTH_MODE_OPEN = 1;
  STREAM_AUTH_MODE_PER_MESSAGE = 2;
}

// 字段号刻意避开 v2 authz.proto 的 52301/52302 与 torchwood 历史号段。
extend google.protobuf.FileOptions    { APISpec api = 53001; }
extend google.protobuf.ServiceOptions { ServiceSpec service = 53002; }
extend google.protobuf.MethodOptions  { MethodSpec method = 53003; }
