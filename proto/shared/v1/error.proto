syntax = "proto3";

package torchwood.shared.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/shared/v1;sharedv1";

// ErrorCode 与 gRPC code 的映射（HTTPErrorHandler 单一事实来源，
// 见 internal/infra/server/errors.go）：
//   - InvalidArgument → ERROR_CODE_INVALID_REQUEST
//   - FailedPrecondition → ERROR_CODE_PRECONDITION_FAILED
//   - NotFound → ERROR_CODE_RESOURCE_NOT_FOUND
//   - AlreadyExists → ERROR_CODE_RESOURCE_CONFLICT
//   - Aborted → ERROR_CODE_CONCURRENT_MODIFICATION
//   - Unauthenticated → ERROR_CODE_INVALID_CREDENTIALS
//   - PermissionDenied → ERROR_CODE_PERMISSION_DENIED
//   - ResourceExhausted → ERROR_CODE_QUOTA_EXCEEDED
//   - DeadlineExceeded → ERROR_CODE_TIMEOUT
//   - 其余 → ERROR_CODE_INTERNAL_ERROR
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_RESOURCE_NOT_FOUND = 2;
  ERROR_CODE_INVALID_CREDENTIALS = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_RESOURCE_CONFLICT = 5;
  ERROR_CODE_QUOTA_EXCEEDED = 6;
  ERROR_CODE_PRECONDITION_FAILED = 7;
  ERROR_CODE_CONCURRENT_MODIFICATION = 8;
  ERROR_CODE_VALUE_OUT_OF_RANGE = 9;
  ERROR_CODE_OPERATION_NOT_ALLOWED = 10;
  ERROR_CODE_INTERNAL_ERROR = 11;
  ERROR_CODE_SERVICE_UNAVAILABLE = 12;
  ERROR_CODE_TIMEOUT = 13;
}

message Error {
  string type = 1;
  string code = 2;
  string message = 3;
  string error_id = 4;
  ErrorCode error_code = 5;
}

message ErrorResponse {
  Error error = 1;
}
