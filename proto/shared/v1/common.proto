syntax = "proto3";

package torchwood.shared.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/shared/v1;sharedv1";

message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
  // filter/order_by（字段号 3/4）已退役（W-K 终结）：静态表面从未实现
  // AIP-160/132 过滤排序，携带即拒的守卫随之删除；POC 无兼容义务，字段号
  // 与名字 reserved 禁止复用。文档面的查询走 queries / shared.v1.Query。
  reserved 3, 4;
  reserved "filter", "order_by";
  // queries 是静态表面遗留的 Appwrite 风格 DSL 串通道，与文档查询栈的单
  // typed AST（shared.v1.Query）相互独立。消费面：users ListUsers 经
  // ParseUserList 白名单解析（equal/greaterThan/lessThan + 白名单属性）；
  // storage buckets/files 与 groups（ListGroups/ListMemberships）不支持——
  // 携带即 InvalidArgument（显式拒绝，不静默忽略）；其余使用本消息的面以
  // 各自 handler 的显式行为为准。
  repeated string queries = 5;
}

message ListResponseMeta {
  int32 page_size = 1;
  string next_page_token = 2;
  string prev_page_token = 3;
  // total_count ≤0 = unknown（keyset 分页下 0 与空集合不可区分，调用方应以 next_page_token 是否为空判定是否还有更多；≤0 表示总数未知）。
  int32 total_count = 4;
}

message Empty {}
