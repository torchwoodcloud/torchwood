syntax = "proto3";

package torchwood.shared.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/shared/v1;sharedv1";

import "buf/validate/validate.proto";

// SortOrder 是时间列排序方向（Console 列表页「按创建时间正/倒序」）。
// 固定排序键 = 各端点的时间列（通常 created_at），不是 AIP-160 任意列
// order_by（W-K 终结裁决维持：filter/order_by 不复活）。UNSPECIFIED =
// 各端点历史默认（created_at DESC，最新在前）。keyset 游标与方向耦合，
// 换向必须从第一页重新开始，携带异向游标即 InvalidArgument。
enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
  // filter/order_by（字段号 3/4）已退役（W-K 终结）：静态表面从未实现
  // AIP-160/132 过滤排序，携带即拒的守卫随之删除；POC 无兼容义务，字段号
  // 与名字 reserved 禁止复用。文档面的查询走 queries / shared.v1.Query。
  reserved 3, 4;
  reserved "filter", "order_by";
  // queries 是静态表面遗留的 DSL 串通道，与文档查询栈的单
  // typed AST（shared.v1.Query）相互独立。消费面：users ListUsers 经
  // ParseUserList 白名单解析（equal/greaterThan/lessThan + 白名单属性）；
  // storage buckets/files 与 groups（ListGroups/ListMemberships）不支持——
  // 携带即 InvalidArgument（显式拒绝，不静默忽略）；其余使用本消息的面以
  // 各自 handler 的显式行为为准。
  repeated string queries = 5;
  // 时间列排序方向；支持面以各 handler 的显式行为为准（Console 列表页
  // 按 created_at 正/倒序），UNSPECIFIED = 历史默认 DESC。
  SortOrder sort_order = 6 [(buf.validate.field).enum.defined_only = true];
}

message ListResponseMeta {
  int32 page_size = 1;
  string next_page_token = 2;
  string prev_page_token = 3;
  // total_count ≤0 = unknown（keyset 分页下 0 与空集合不可区分，调用方应以 next_page_token 是否为空判定是否还有更多；≤0 表示总数未知）。
  int32 total_count = 4;
}

message Empty {}
