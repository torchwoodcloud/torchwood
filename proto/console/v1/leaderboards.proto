syntax = "proto3";

package torchwood.console.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/console/v1;consolev1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";
import "shared/v1/leaderboard.proto";

// 服务默认 access=permission（console admin 角色）：swagger 顶层声明
// cookie security（TORCHWOOD_session_console 会话）；方法级角色以
// method_auth.permissions 声明（详见 docs/developer/09-api-guide.md §1.4）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "cookie"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "permission" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// LeaderboardsService 是排行榜 console 面：board 配置 CRUD、期 top、按
// subject 查条目、删条目（作弊处理——只有未封榜期可删，封榜即终局）。
service LeaderboardsService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_PERMISSION };

  rpc CreateLeaderboardBoard(CreateLeaderboardBoardRequest) returns (shared.v1.LeaderboardBoard) {
    option (google.api.http) = { post: "/v1/console/leaderboards/boards", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }
  rpc ListLeaderboardBoards(ListLeaderboardBoardsRequest) returns (ListLeaderboardBoardsResponse) {
    option (google.api.http) = { get: "/v1/console/leaderboards/boards" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }
  rpc GetLeaderboardBoard(GetLeaderboardBoardRequest) returns (shared.v1.LeaderboardBoard) {
    option (google.api.http) = { get: "/v1/console/leaderboards/boards/{board_id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }
  rpc UpdateLeaderboardBoard(UpdateLeaderboardBoardRequest) returns (shared.v1.LeaderboardBoard) {
    option (google.api.http) = { patch: "/v1/console/leaderboards/boards/{board_id}", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }
  rpc DeleteLeaderboardBoard(DeleteLeaderboardBoardRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/console/leaderboards/boards/{board_id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }
  rpc ListLeaderboardBoardPeriods(ListLeaderboardBoardPeriodsRequest) returns (ListLeaderboardBoardPeriodsResponse) {
    option (google.api.http) = { get: "/v1/console/leaderboards/boards/{board_id}/periods" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }
  rpc ListLeaderboardTop(ListLeaderboardTopRequest) returns (shared.v1.ListLeaderboardTopResponse) {
    option (google.api.http) = { get: "/v1/console/leaderboards/boards/{board_id}/top" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }
  rpc GetLeaderboardEntry(GetLeaderboardEntryRequest) returns (shared.v1.LeaderboardScoreSnapshot) {
    option (google.api.http) = { get: "/v1/console/leaderboards/boards/{board_id}/entries/{subject_id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }
  rpc DeleteLeaderboardEntry(DeleteLeaderboardEntryRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/console/leaderboards/boards/{board_id}/entries/{subject_id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }

  // —— Phase 2：结榜发奖（settled 拒绝 void/rerun；作弊处理窗口 = 宽限期）——
  rpc GetLeaderboardSettlement(GetLeaderboardSettlementRequest) returns (GetLeaderboardSettlementResponse) {
    option (google.api.http) = { get: "/v1/console/leaderboards/boards/{board_id}/settlements/{period}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }
  rpc ListLeaderboardSettlements(ListLeaderboardSettlementsRequest) returns (ListLeaderboardSettlementsResponse) {
    option (google.api.http) = { get: "/v1/console/leaderboards/boards/{board_id}/settlements" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }
  rpc VoidLeaderboardSettlement(VoidLeaderboardSettlementRequest) returns (LeaderboardSettlementAck) {
    option (google.api.http) = { post: "/v1/console/leaderboards/boards/{board_id}/settlements/{period}:void" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }
  rpc RerunLeaderboardSettlement(RerunLeaderboardSettlementRequest) returns (LeaderboardSettlementAck) {
    option (google.api.http) = { post: "/v1/console/leaderboards/boards/{board_id}/settlements/{period}:rerun" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }
}

message CreateLeaderboardBoardRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = { pattern: "^[a-z_][a-z0-9_]*$", max_len: 40 }
  ];
  // asc | desc（缺省 desc）
  string sort = 2;
  // 声明单列 tiebreak 及方向（asc | desc）；缺省不声明
  string tiebreak_order = 3;
  // parallel | earliest | latest（缺省 parallel）
  string tie_break = 4;
  // none | daily | weekly | monthly（缺省 none）
  string period_kind = 5;
  string period_tz = 6;
  // best | latest | sum（缺省 best）
  string policy = 7;
  optional int64 value_min = 8;
  optional int64 value_max = 9;
  bool client_submit = 10;
  // 每期每主体提交次数上限（缺省 100，1..10000）
  int32 per_subject_submit_limit = 11;
  int32 retention_periods = 12;
  string subject_kind = 13;
  repeated shared.v1.LeaderboardRewardRule rewards = 14;
}

message ListLeaderboardBoardsRequest {}

message ListLeaderboardBoardsResponse {
  repeated shared.v1.LeaderboardBoard boards = 1;
}

message GetLeaderboardBoardRequest {
  string board_id = 1 [(buf.validate.field).required = true];
}

// UpdateLeaderboardBoardRequest 用 proto3 optional 表达"未设置 = 不修改"；
// 显式清空走 clear_* 布尔。period/sort/tiebreak 声明/policy/tie_break 在
// 榜内已有条目时不可改（FailedPrecondition）。
message UpdateLeaderboardBoardRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  optional string sort = 2;
  optional string tiebreak_order = 3;
  bool clear_tiebreak = 4;
  optional string tie_break = 5;
  optional string period_kind = 6;
  optional string period_tz = 7;
  optional string policy = 8;
  optional int64 value_min = 9;
  optional int64 value_max = 10;
  bool clear_value_bounds = 11;
  optional bool client_submit = 12;
  optional int32 per_subject_submit_limit = 13;
  optional int32 retention_periods = 14;
  optional string subject_kind = 15;
  // 非空 = 整体替换；clear_rewards = true 显式清空
  repeated shared.v1.LeaderboardRewardRule rewards = 16;
  bool clear_rewards = 17;
}

message DeleteLeaderboardBoardRequest {
  string board_id = 1 [(buf.validate.field).required = true];
}

message ListLeaderboardBoardPeriodsRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  int32 limit = 2 [(buf.validate.field).int32 = { gte: 0, lte: 200 }];
}

message ListLeaderboardBoardPeriodsResponse {
  repeated string periods = 1;
}

message ListLeaderboardTopRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string period = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = { gte: 0, lte: 100 }];
  string page_token = 4;
}

message GetLeaderboardEntryRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string subject_id = 2 [(buf.validate.field).required = true];
  string period = 3;
}

message DeleteLeaderboardEntryRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string subject_id = 2 [(buf.validate.field).required = true];
  string period = 3 [(buf.validate.field).required = true];
}

message GetLeaderboardSettlementRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string period = 2 [(buf.validate.field).required = true];
}

message GetLeaderboardSettlementResponse {
  shared.v1.LeaderboardSettlement settlement = 1;
  repeated shared.v1.LeaderboardSettlementGrant grants = 2;
}

message ListLeaderboardSettlementsRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  int32 limit = 2 [(buf.validate.field).int32 = { gte: 0, lte: 200 }];
}

message ListLeaderboardSettlementsResponse {
  repeated shared.v1.LeaderboardSettlement settlements = 1;
}

message VoidLeaderboardSettlementRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string period = 2 [(buf.validate.field).required = true];
}

message RerunLeaderboardSettlementRequest {
  string board_id = 1 [(buf.validate.field).required = true];
  string period = 2 [(buf.validate.field).required = true];
}

message LeaderboardSettlementAck {}
