syntax = "proto3";

package torchwood.console.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/console/v1;consolev1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "console/v1/admins.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=public：swagger 顶层不声明全局 security（匿名可达），
// 仅声明 securityDefinitions 供统一引用（详见 docs/developer/09-api-guide.md §1.4）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "public" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service ConsoleAuthService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_PUBLIC };

  rpc SignIn(SignInRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/console/auth/sign-in", body: "*" };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/console/auth/refresh", body: "*" };
  }

  rpc SignOut(SignOutRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { post: "/v1/console/auth/sign-out", body: "*" };
  }

  // 查询是否已完成初始化（admins 是否为空）。
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse) {
    option (google.api.http) = { get: "/v1/console/auth/setup-status" };
  }

  // 首个管理员注册：仅当 admins 表为空且携带正确 setup token 时可用；
  // 须同时指定 project_id 与 database_id，创建 owner + 项目 + 数据库。
  // 不生成 API Key，登录后在 Console 的 API Key 页面创建。
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (google.api.http) = { post: "/v1/console/auth/sign-up", body: "*" };
  }
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string refresh_token = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message SignOutRequest {}

message GetSetupStatusRequest {}

message GetSetupStatusResponse {
  bool needs_setup = 1;
  // 部署方是否配置了 TORCHWOOD_SECURITY_SETUP_TOKEN；为 true 时登录页
  // 需展示 setup token 输入框。
  bool setup_token_required = 2;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  // Console 引导令牌（security.setup_token / TORCHWOOD_SECURITY_SETUP_TOKEN）。
  string setup_token = 3;
  // 首个项目 ID，须匹配 ^[a-z][a-z0-9]{0,27}$。
  string project_id = 4;
  // 首个业务数据库 ID，规则同 project_id。CreateProject 把它作为第一业务库
  // 创建（缺省 default）；系统集合在项目数据面 tw_<project>，不在该库。
  string database_id = 5;
}

message SignUpResponse {
  Admin admin = 1;                   // 复用 admins.proto 的 Admin 消息
  string access_token = 2;           // 与 SignInResponse 一致，便于前端统一处理
  string refresh_token = 3;
  reserved 4;
  reserved "default_api_key_secret";
}
