syntax = "proto3";

package torchwood.console.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/console/v1;consolev1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=permission（console admin 角色）：swagger 顶层声明
// cookie security（TORCHWOOD_session_console 会话）；方法级角色以
// method_auth.permissions 声明（详见 docs/developer/09-api-guide.md §1.4）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "cookie"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "permission" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// AdminsService 管理系统管理员（admins 表）。
// 权限模型：owner/admin 角色可查看列表；创建、修改、删除仅 owner 可执行。
// 方法与 client/server API 不同，这里直接使用 console admin role 作为权限串。
service AdminsService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_PERMISSION };

  rpc GetCurrentAdmin(GetCurrentAdminRequest) returns (Admin) {
    option (google.api.http) = { get: "/v1/console/admins/me" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["console"]
    };
  }

  // UpdateCurrentAdmin 当前登录管理员自助更新个人偏好（非 role/password 等
  // 敏感字段；管理他人走 UpdateAdmin）。仅暴露 typed 偏好字段，存储侧落在
  // admins.metadata JSONB（见 Admin.timezone 注释）。
  rpc UpdateCurrentAdmin(UpdateCurrentAdminRequest) returns (Admin) {
    option (google.api.http) = { patch: "/v1/console/admins/me", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["console"]
    };
  }

  rpc ListAdmins(ListAdminsRequest) returns (ListAdminsResponse) {
    option (google.api.http) = { get: "/v1/console/admins" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner", "admin"]
    };
  }

  rpc CreateAdmin(CreateAdminRequest) returns (Admin) {
    option (google.api.http) = { post: "/v1/console/admins", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }

  rpc UpdateAdmin(UpdateAdminRequest) returns (Admin) {
    option (google.api.http) = { patch: "/v1/console/admins/{id}", body: "*" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }

  rpc DeleteAdmin(DeleteAdminRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/console/admins/{id}" };
    option (torchwood.shared.v1.method_auth) = {
      access: ACCESS_PERMISSION
      permissions: ["owner"]
    };
  }
}

message GetCurrentAdminRequest {}

message UpdateCurrentAdminRequest {
  // optional：未设置 = 不修改；设置空串 = 清除偏好（跟随浏览器时区）；
  // 设置非空 = 更新为该 IANA 时区名（如 Asia/Shanghai）。形状在此校验，
  // IANA 有效性由 use-case 层 time.LoadLocation 权威判定。
  optional string timezone = 1 [(buf.validate.field).string = {
    pattern: "^[A-Za-z]+(/[A-Za-z0-9_+-]+)*$"
    max_len: 64
  }];
}

message ListAdminsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListAdminsResponse {
  repeated Admin admins = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message CreateAdminRequest {
  string email = 1;
  string password = 2;
  string role = 3;
}

message UpdateAdminRequest {
  string id = 1;
  // optional：未设置（或空串）= 不修改；设置合法角色值 = 更新（R10-P1-6）。
  optional string role = 2;
  string password = 3; // 非空则重置密码
}

message DeleteAdminRequest {
  string id = 1;
}

message Admin {
  string id = 1;
  string email = 2;
  string role = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // 用户偏好时区（IANA 名，自 admins.metadata.timezone 投影；空 = 未设置，
  // 前端回退浏览器时区）。metadata 本身不出 proto，新增偏好键在此追加
  // typed 字段。
  string timezone = 6;
}
