message SignUpRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string project_id = 4;
  // 邀请码（T-03）：仅项目注册策略为 invite_only 时必填；open 项目忽略。
  optional string invite_code = 5;
}

message SignInRequest {
  string email = 1;
  string password = 2;
  string project_id = 3;
}

message SignOutRequest {
  string project_id = 1;
}

message MeRequest {
  string project_id = 1;
}

message Account {
  string id = 1;
  string email = 2;
  string name = 3;
  string status = 4;
  bool email_verified = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TokenBundle {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message SignUpResponse {
  Account account = 1;
  TokenBundle tokens = 2;
  bool mfa_required = 3;        // 用户有 verified 因子且未完成挑战时 true
  string challenge_token = 4;   // mfa_required 时返回（5min 一次性）
  repeated Factor factors = 5;  // mfa_required 时返回（不含 secret）
}

message SignInResponse {
  Account account = 1;
  TokenBundle tokens = 2;
  bool mfa_required = 3;        // 用户有 verified 因子且未完成挑战时 true
  string challenge_token = 4;   // mfa_required 时返回（5min 一次性）
  repeated Factor factors = 5;  // mfa_required 时返回（不含 secret）
}

message RefreshTokenRequest {
  string project_id = 1;
  string refresh_token = 2;
}

message RefreshTokenResponse {
  TokenBundle tokens = 1;
}

message UpdateAccountRequest {
  // name/email 为 optional：未设置 = 不修改；设置（含空串）= 更新/清空。
  optional string name = 1;
  optional string email = 2;
  string password = 3;
  string old_password = 4;
  // 改邮箱时必填：用于拼接新邮箱验证链接（语义同 CreateVerificationRequest.url）。
  string url = 5;
}

// DELETE /v1/account 无请求体（REST 不带 body）；目标 = 凭证主体自身。
message DeleteAccountRequest {}

message ConfirmEmailChangeRequest {
  string project_id = 1;
  string user_id = 2;
  string secret = 3;
}

message Session {
  string id = 1;
  string user_id = 2;
  string provider = 3;
  string user_agent = 4;
  string ip = 5;
  google.protobuf.Timestamp expire_at = 6;
  google.protobuf.Timestamp created_at = 7;
  bool current = 8;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message DeleteSessionRequest {
  // proto3 隐式 presence 的标量字段：required 即"非零值"（空串视为未设置）。
  // 求值方与层次边界见 09-api-guide §2.3。
  string session_id = 1 [(buf.validate.field).required = true];
}

message DeleteSessionsRequest {
  bool keep_current = 1;
}

message GetPrefsRequest {}

message GetPrefsResponse {
  google.protobuf.Struct prefs = 1;
}

message UpdatePrefsRequest {
  // 形状约束（buf.validate）由 validate 拦截器统一求值（09-api-guide §2.3）；
  // 业务规则仍留在 app 用例层。
  google.protobuf.Struct prefs = 1 [(buf.validate.field).required = true];
}

message CreateEmailOTPRequest {
  string project_id = 1;
  string email = 2;
}

message CreateEmailOTPSessionRequest {
  string project_id = 1;
  string email = 2;
  string challenge_id = 3;
  string otp = 4;
}

message ChallengeResponse {
  string challenge_id = 1;
  google.protobuf.Timestamp expire_at = 2;
}

message CreateOAuth2SessionRequest {
  string provider = 1;
  string project_id = 2;
  string success = 3;
  string failure = 4;
}

message CreateOAuth2SessionResponse {
  string redirect_url = 1;
}

message CreateOAuth2TokenSessionRequest {
  string provider = 1;
  string project_id = 2;
  string success = 3;
  string failure = 4;
  string code = 5;
  string state = 6;
}

message CreatePhoneOTPRequest {
  string project_id = 1;
  string phone = 2;
}

message CreatePhoneOTPSessionRequest {
  string project_id = 1;
  string phone = 2;
  string challenge_id = 3;
  string otp = 4;
}

message CreateWeChatMiniProgramSessionRequest {
  string project_id = 1;
  string code = 2;
}

message CreateAnonymousSessionRequest {
  string project_id = 1;
}

message CreateOAuth2LinkSessionRequest {
  string provider = 1;
  string project_id = 2;
  string success = 3;
  string failure = 4;
}

message CreateOAuth2LinkTokenSessionRequest {
  string provider = 1;
  string project_id = 2;
  string code = 3;
  string state = 4;
}

message CreateVerificationRequest {
  string project_id = 1;
  string url = 2;
}

message CreateVerificationResponse {
  string user_id = 1;
  google.protobuf.Timestamp expire_at = 2;
}

message UpdateVerificationRequest {
  string project_id = 1;
  string user_id = 2;
  string secret = 3;
}

message CreateRecoveryRequest {
  string project_id = 1;
  string email = 2;
  string url = 3;
}

message UpdateRecoveryRequest {
  string project_id = 1;
  string user_id = 2;
  string secret = 3;
  string password = 4;
}

// ---- MFA ----
message Factor {
  string id = 1;
  string type = 2;      // totp
  string status = 3;    // pending / verified
  google.protobuf.Timestamp created_at = 4;
}

message ListFactorsRequest {}

message ListFactorsResponse {
  repeated Factor factors = 1;
}

message CreateTOTPFactorRequest {}

message TOTPFactor {
  Factor factor = 1;
  string secret = 2;        // 仅创建响应返回明文 secret
  string otpauth_url = 3;   // otpauth://totp/{issuer}:{email}?secret=...&issuer=...
}

message VerifyTOTPFactorRequest {
  string factor_id = 1;
  string code = 2;
}

message DeleteFactorRequest {
  string factor_id = 1;
  // 删除 verified 因子时的 TOTP 二次验证码（REST 经 query 传 ?code=...，
  // DELETE 不带 body）；pending 因子无需提供。未提供时 verified 因子
  // 拒绝删除（InvalidArgument，R05-P1-4）。
  string code = 2;
}

message CreateMFASessionRequest {
  string project_id = 1;
  string challenge_token = 2;
  string factor_id = 3;
  string code = 4;
}

// ---- JWT ----
message CreateJWTRequest {}

message CreateJWTResponse {
  string token = 1;
}

// ---- Magic URL ----
message CreateMagicURLSessionRequest {
  string project_id = 1;
  string email = 2;
  string url = 3;   // 登录成功后的回调地址（白名单校验）
}

message UpdateMagicURLSessionRequest {
  string project_id = 1;
  string user_id = 2;
  string secret = 3;
}

// ---- Logs ----
message ListLogsRequest {
  // limit 已废弃：请用 page_size；保留兼容旧 SDK，服务端优先取 page_size。
  int32 limit = 1 [deprecated = true];
  int32 page_size = 2;
  string page_token = 3;
}

message LogEntry {
  string id = 1;
  string action = 2;        // gRPC 方法名（如 /torchwood.client.v1.AccountService/SignIn）
  string status = 3;
  string resource_id = 4;
  string ip = 5;
  string user_agent = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListLogsResponse {
  repeated LogEntry logs = 1;
  shared.v1.ListResponseMeta meta = 2;
}
