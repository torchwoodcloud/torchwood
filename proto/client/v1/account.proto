syntax = "proto3";

package torchwood.client.v1;

option go_package = "github.com/torchwoodcloud/torchwood/genproto/client/v1;clientv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=authenticated：swagger 顶层声明 Bearer security；
// ACCESS_PUBLIC 方法逐方法声明 security: [] + x-torchwood-access: "public"
// （详见 docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>（Client API 登录态）"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "end_user" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service AccountService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_END_USER };

  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (google.api.http) = { post: "/v1/account/sign-up", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc SignIn(SignInRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/sign-in", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc SignOut(SignOutRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { post: "/v1/account/sign-out", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "end_user" }
      }
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = { post: "/v1/account/refresh", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc Me(MeRequest) returns (Account) {
    option (google.api.http) = { get: "/v1/account/me" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "end_user" }
      }
    };
  }

  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = { patch: "/v1/account", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "end_user" }
      }
    };
  }

  // 注销当前登录账号（T-03）：匿名化软删——凭据立即失效（全部会话撤销 +
  // 状态置 deleted，每次鉴权实时校验），email/name/手机号/凭据哈希就地
  // 清洗，同邮箱可立即重新注册（不泄露"曾存在"）；其名下文档/文件/审计
  // 行保留为孤儿数据（显式决策，不做级联删除）。
  rpc DeleteAccount(DeleteAccountRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/account" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "end_user" }
      }
    };
  }

  // 确认邮箱变更：消费邮件中的一次性 secret，验证通过后 email 才切换
  //（staging：验证前 email 保持旧值，旧邮箱仍可登录/找回）。
  // ACCESS_PUBLIC：邮件链接点开即完成（与 recovery 同一安全模型——256-bit
  // 随机 secret + 24h TTL + GETDEL 一次性消费），点链接无需登录态。
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (Account) {
    option (google.api.http) = { put: "/v1/account/email-change", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = { get: "/v1/account/sessions" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "end_user" }
      }
    };
  }

  rpc DeleteSession(DeleteSessionRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/account/sessions/{session_id}" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "end_user" }
      }
    };
  }

  rpc DeleteSessions(DeleteSessionsRequest) returns (shared.v1.Empty) {
    // REST 绑定：DELETE 不带 body（避免依赖 allow_delete_body），
    // keep_current 经 query 传递：DELETE /v1/account/sessions?keep_current=true。
    option (google.api.http) = { delete: "/v1/account/sessions" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "end_user" }
      }
    };
  }

  rpc GetPrefs(GetPrefsRequest) returns (GetPrefsResponse) {
    option (google.api.http) = { get: "/v1/account/prefs" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_END_USER };
