syntax = "proto3";

package torchwood.client.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/client/v1;clientv1";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";
import "shared/v1/document.proto";
import "shared/v1/query.proto";

// 服务默认 access=authenticated：swagger 顶层声明 Bearer security；
// ACCESS_PUBLIC 方法逐方法声明 security: [] + x-torchwood-access: "public"
// （详见 docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>（Client API 登录态）"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "end_user" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service DatabasesService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_END_USER };

  // 自定义方法说明：documents:count 为自定义方法段（REST 自定义动词），不再占用
  // document_id 命名空间；document_id 可自由取任意合法值。
  rpc CreateDocument(CreateDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/collections/{collection_id}/documents", body: "*" };
  }

  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/databases/{database_id}/collections/{collection_id}/documents"
      additional_bindings {
        post: "/v1/databases/{database_id}/collections/{collection_id}/documents:list"
        body: "query"
      }
    };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc GetDocument(GetDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { get: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc UpdateDocument(UpdateDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { patch: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc UpsertDocument(UpsertDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { put: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc DeleteDocument(DeleteDocumentRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}" };
  }

  rpc CountDocuments(CountDocumentsRequest) returns (CountDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/databases/{database_id}/collections/{collection_id}/documents:count"
      additional_bindings {
        post: "/v1/databases/{database_id}/collections/{collection_id}/documents:count"
        body: "*"
      }
    };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  // ListChanges 返回集合的已提交事件流（阶段④ §4.5 补偿 API，与 Server 面
  // 同用例核心）：seq 升序、按请求者可见性过滤；delete 事件为天然
  // tombstone。since_seq 为续传游标；has_more=true 时以末条 seq 续传。
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option (google.api.http) = { get: "/v1/databases/{database_id}/collections/{collection_id}/changes" };
  }
}

message CreateDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  // 客户端自选 document_id；documents:count 为自定义方法段（REST 自定义动词），
  // 不再占用 document_id 命名空间，可自由取任意合法值。
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  // 写幂等键（redesign §4.1/§10.1）：作用域 (project, actor, request_id)，
  // 24h 内同键重放返回首次成功响应（响应头 x-torchwood-replayed: true）；
  // 同键不同请求 → IDEMPOTENCY.KEY_CONFLICT。HTTP 面等价 Idempotency-Key 头。
  optional string request_id = 6;
}

message UpdateDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  map<string, int64> increment = 6;
  // 用户集合强制 OCC：必须与当前行 _version 相等；未设置 = version_required。
  optional int64 version = 7;
  // 写幂等键，语义同 CreateDocumentRequest.request_id。
  optional string request_id = 8;
  // 数组列原子更新（§10.5 P0，仅 array=true 属性；与 data/increment 组合时
  // 同列冲突 → InvalidArgument）。
  map<string, torchwood.shared.v1.ArrayUpdate> array_updates = 9;
}

message UpsertDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  repeated string conflict_columns = 6;
  // 写幂等键，语义同 CreateDocumentRequest.request_id。
  optional string request_id = 7;
}

message GetDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  string project_id = 4;
}

message DeleteDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  // 用户集合强制 OCC：必须与当前行 _version 相等；未设置 = version_required。
  optional int64 version = 4;
  // 写幂等键，语义同 CreateDocumentRequest.request_id。
  optional string request_id = 5;
}

message ListDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  // 单 AST（C7）：queries DSL 字符串已退役（POC 无兼容期，直接 reserved）。
  reserved 3;
  reserved "queries";
  // GET 面专用（C7 预决策 3）：page_size/page_token 保留为简单分页参数；
  // 过滤/排序/投影一律走 query（POST :list 的 body 即 Query）。
  int32 page_size = 4;
  string page_token = 5;
  string project_id = 6;
  // Typed AST（唯一过滤载体）。page_size/page_token 与 query 内同名字段
  // 同时设置且不等 → InvalidArgument。
  torchwood.shared.v1.Query query = 7;
}

message ListDocumentsResponse {
  repeated shared.v1.Document documents = 1;
  shared.v1.ListResponseMeta meta = 2;
  // KNN 距离回传（会话 #10）：与 documents 平行，语义同 server 面的
  // ListDocumentsResponse.distances（仅 vector_search 查询时填充）。
  repeated double distances = 3;
}

// CountDocumentsRequest 独立于 ListDocumentsRequest（P3-9）：不暴露无效分页参数（page_size/page_token）。
message CountDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  // 单 AST（C7）：queries DSL 字符串已退役；过滤走 query（GET 面仅支持无过滤计数）。
  reserved 3;
  reserved "queries";
  torchwood.shared.v1.Query query = 4;
  string project_id = 5;
}

message CountDocumentsResponse {
  int64 count = 1;
}

// ListChangesRequest（阶段④ §4.5）：集合事件补偿查询。
message ListChangesRequest {
  string database_id = 1;
  string collection_id = 2;
  // 续传游标：返回 seq > since_seq 的事件。0 = 从最老可用事件起（缺省）；
  // 早于最老可用事件 → FailedPrecondition EVENTS.RESUME_EXPIRED。
  int64 since_seq = 3;
  // 单页条数，缺省/上限 500。
  int32 limit = 4;
  string project_id = 5;
}

message ListChangesResponse {
  repeated shared.v1.Change changes = 1;
  // 仍有更多可见事件或扫描触顶：续传下一页。
  bool has_more = 2;
  // 扫描游标（R15）：越过不可见事件；续传**优先使用本字段**，仅当为 0
  // 时回退 changes 末条 seq。has_more=true 时必有值。
  int64 next_since_seq = 3;
}
