syntax = "proto3";

package torchwood.client.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/client/v1;clientv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=authenticated：swagger 顶层声明 Bearer security
// （详见 docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>（Client API 登录态）"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "end_user" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

// PaymentsService 是终端用户支付面（v3 设计 §6）：建单（幂等键 + purpose）
// 与本人订单查询。回调端点 POST /v1/payments/callbacks/{provider} 是裸
// HTTP（渠道验签，不走 gRPC gateway，见 internal/api/serverhttp）。
service PaymentsService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_END_USER };

  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = { post: "/v1/payments/orders", body: "*" };
  }
  rpc GetMyOrder(GetMyOrderRequest) returns (PaymentOrder) {
    option (google.api.http) = { get: "/v1/payments/orders/{order_id}" };
  }
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListMyOrdersResponse) {
    option (google.api.http) = { get: "/v1/payments/orders" };
  }
  // VerifyReceipt 校验 iOS IAP receipt / StoreKit 2 JWS 并履约对应订单
  // （设计 §1.2：iOS 无服务端下单，走验票路径）。
  rpc VerifyReceipt(VerifyReceiptRequest) returns (VerifyReceiptResponse) {
    option (google.api.http) = { post: "/v1/payments/ios/verify-receipt", body: "*" };
  }
}

// PaymentOrder 是支付订单（v3 设计 §1.3）。amount 一律最小货币单位的
// int64（禁止 float）；status 状态机：
// created → paying → paid | failed | closed → refunding → refunded。
message PaymentOrder {
  string id = 1;
  string provider = 2;
  int64 amount = 3;
  string currency = 4;
  // topup | item_purchase | subscription
  string purpose_kind = 5;
  // 用途载荷：{currency_code, amount} / {asset_code, quantity} / {plan_code}
  google.protobuf.Struct purpose = 6;
  string status = 7;
  string idempotency_key = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp paid_at = 10;
  google.protobuf.Timestamp expires_at = 11;
  // 渠道收银台地址（Stripe Checkout URL 等）；仅 CreateOrder 响应填充，
  // 查询接口不返回。
  string payment_url = 12;
}

message CreateOrderRequest {
  // 客户端建单幂等键：同 (project, key) 重复建单返回原单（设计 §1.3）。
  string idempotency_key = 1;
  // stripe | wechat | alipay | ios_iap。
  string provider = 2;
  // 最小货币单位金额，必须 > 0（如 1999 = 19.99 USD）。
  int64 amount = 3;
  // ISO-4217 三字母码（usd / cny ...）。
  string currency = 4;
  // topup | item_purchase（subscription 在 PR3 开放）。
  string purpose_kind = 5;
  google.protobuf.Struct purpose = 6;
  // Checkout 回跳地址（Stripe 一次性支付）；未传则用 server.http.public_url。
  optional string success_url = 7;
  optional string cancel_url = 8;
}

message CreateOrderResponse {
  PaymentOrder order = 1;
  // true = 命中幂等键返回原单（未向渠道重复下单）。
  bool idempotent_replay = 2;
}

message GetMyOrderRequest {
  string order_id = 1 [(buf.validate.field).required = true];
}

message ListMyOrdersRequest {
  int32 page_size = 1;
  // 不透明游标（上一页最后一条的创建时间）。
  string page_token = 2;
}

message ListMyOrdersResponse {
  repeated PaymentOrder orders = 1;
  shared.v1.ListResponseMeta meta = 2;
}

// VerifyReceiptRequest 是 iOS 验票请求：receipt 为 StoreKit base64 PKCS7
// 或 StoreKit 2 signed transaction JWS；order_id 指向本人 ios_iap 订单。
message VerifyReceiptRequest {
  string order_id = 1 [(buf.validate.field).required = true];
  string receipt = 2 [(buf.validate.field).required = true];
}

message VerifyReceiptResponse {
  PaymentOrder order = 1;
  string transaction_id = 2;
  // true = 同 transactionId 重放（已履约，不重复发货）。
  bool idempotent_replay = 3;
}
