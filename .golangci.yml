# golangci-lint v2 配置。
#
# J6-3（Round 4）：standard 五件套之外新增 bodyclose / gosec / sqlclosecheck /
# noctx；存量遗留债已清零，CI 与 Taskfile 均为全量门禁（不再使用
# --new-from-rev 棘轮）。
#
# 新增 linter 首跑共发现 77 条。测试文件中的发现已全部修复；以下 exclusions
# 仅暂挂生产代码中的存量项（多为低危：G115 分页 total_count 整型转换、
# G304 读取调用方指定路径等）。每条暂挂须在对应行内注释修复方案后移除；
# 禁止向本清单追加新路径（新代码必须过全量门禁）。
#
# 2026-09-10：workflows 停用期间（删除→恢复）积累的代码首跑门禁共 68 条，
# 除行内 #nosec/修复外，本清单追加的 4 条全部为测试数据误报与同性质生产
# 误报（G122 对行内注释不生效；admins.go 的 total_count 截断与既有分页
# G115 组同性质），修复口径见各条注释与提交 45ba053 后续。
version: "2"

run:
  timeout: 10m

# 关闭截断上限：默认 max-same-issues=3 会隐藏同类问题的真实数量，
# 且使结果随报告顺序漂移（门禁必须确定性）。
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - noctx
    - sqlclosecheck
  exclusions:
    # 第三方 vendored 代码不参与门禁。
    paths:
      - console/node_modules/.*
    rules:
      # ---- gosec 暂挂（生产存量，逐文件精确圈定）----
      # Cookie 安全属性由网关/CORS 层统一保障（J7-4/J7-5 有后续收口计划）。
      - path: internal/api/clientgrpc/account\.go
        linters: [gosec]
        text: "G124"
      - path: internal/api/consolegrpc/cookies\.go
        linters: [gosec]
        text: "G124"
      # OAuth redirect target 来自 provider state 回跳白名单校验；cookie 由网关层保障。
      - path: internal/api/serverhttp/oauth_handler\.go
        linters: [gosec]
        text: "G(710|124)"
      # int64 -> int32 的 total_count/PageSize 截断：AIP-158 分页上限远小于 int32 界。
      - path: internal/api/servergrpc/.*\.go
        linters: [gosec]
        text: "G115"
      - path: internal/api/clientgrpc/(databases|groups)\.go
        linters: [gosec]
        text: "G115"
      - path: pkg/crud/list\.go
        linters: [gosec]
        text: "G115"
      # ParseMultipartForm 内存上限已有 MaxBytesReader + gRPC MaxRecvMsgSize 兜底。
      - path: internal/api/serverhttp/(file_handler|functions_handler)\.go
        linters: [gosec]
        text: "G120"
      - path: internal/app/functions/deployments\.go
        linters: [gosec]
        text: "G301"
      - path: internal/infra/bun/bunrepo/outbox_repo\.go
        linters: [gosec]
        text: "G115"
      # Functions 构建目录/解压预算：budgetWriter 已限制解压总量，权限为构建产物非机密；
      # OpenFile/Open 目标来自 zip 白名单解压路径（已拒 zip-slip）。
      - path: internal/infra/functions/docker\.go
        linters: [gosec]
        text: "G(110|115|122|301|302|304|306)"
      # Apple App Store 共享密钥本就是请求体必填字段（非泄漏路径）。
      - path: internal/infra/payments/iosiap/iosiap\.go
        linters: [gosec]
        text: "G117"
      # Redis key 前缀常量含 token 字样，非凭证。
      - path: internal/infra/auth/account_token_redis\.go
        linters: [gosec]
        text: "G101"
      # PageSize 已在解析层 clamp 到 ≤100（pkg/query）。
      - path: pkg/query/query\.go
        linters: [gosec]
        text: "G109"
      # CLI `functions code` / dispatcher 客户端 Build 按用户指定路径读取函数
      # 代码包——功能本身即读取本地文件。
      - path: (cmd/torchwood/cmd/functions|internal/infra/functions/dispatcher_client)\.go
        linters: [gosec]
        text: "G304"
      # Redis 限频 Lua 脚本常量含 token/INCR 字样误报（非凭证）。
      - path: internal/infra/functions/trigger_ip_ratelimit\.go
        linters: [gosec]
        text: "G101"
      # WalkDir 打包自有构建目录（daemon.go 构建产物 → tar 上下文），
      # G122 对行内 #nosec 注释不生效，故此处圈定。
      - path: functionsdispatcher/daemon\.go
        linters: [gosec]
        text: "G122"
      # 测试内 Walk 回调读取仓库自有测试数据，无符号链接攻击面（G122 对行内
      # #nosec 注释不生效，故此处圈定）。
      - path: (internal/app/payments/payments_unit_test|internal/domain/assets/service_test)\.go
        linters: [gosec]
        text: "G122"
      - path: pkg/password/password\.go
        linters: [gosec]
        text: "G115"
      # ---- noctx 暂挂 ----
      - path: internal/infra/messaging/mailer\.go
        linters: [noctx]
        text: "DialWithDialer"
      # httptest.NewRequest 不存在 WithContext 变体，noctx 建议的 API 是误报。
      - path: .*_test\.go
        linters: [noctx]
        text: "httptest.NewRequest"
      # ---- unused 暂挂 ----
      # cmd/worker 的 version 元数据由 J1-3 统一重写，落地后删除本条。
      - path: cmd/worker/main\.go
        linters: [unused]
      # ---- 2026-09-10 workflows 停用期存量暂挂（测试数据/同性质误报）----
      # 测试夹具中的伪 token/DSN/URL（非凭证）。
      - path: (cmd/torchwood/cmd/admin_roles_sig_test|functionsdispatcher/daemon_integration_test|internal/app/server/apikeys_test|internal/domain/projects/oauth_redirect_test|pkg/query/proto/proto_test)\.go
        linters: [gosec]
        text: "G101"
      # 测试读取仓库自有生成物/夹具文件。
      - path: (cmd/server/internal/runtime/grpc_swagger_test|internal/domain/databases/docrole_test)\.go
        linters: [gosec]
        text: "G304"
      # 测试 Walk 回调读取 genproto 生成目录（G122 对行内 #nosec 注释不生效）。
      - path: cmd/server/internal/runtime/grpc_swagger_test\.go
        linters: [gosec]
        text: "G122"
      # console admin 列表 total_count int32 截断：管理台分页量级远小于 int32
      # （与上方 AIP-158 分页 G115 组同性质）。
      - path: internal/api/consolegrpc/admins\.go
        linters: [gosec]
        text: "G115"
