version: '3'
dotenv: ['.env']

tasks:
  list:
    desc: List all tasks (alias for task --list-all)
    cmds:
      - task --list-all
    silent: true

  tools:install:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - go install github.com/bufbuild/buf/cmd/buf@v1.65.0
      - go install github.com/google/wire/cmd/wire@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

  generate:config:
    dir: '{{.USER_WORKING_DIR}}/internal/pkg/config'
    cmds:
      - protoc -I. --go_out=. --go_opt=paths=source_relative ./config.proto

  generate:proto:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - buf lint
      - buf generate

  lint:proto:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - buf lint
      - buf breaking --against '.git#branch=origin/main'

  docker:up:
    dir: '{{.USER_WORKING_DIR}}/docker/local'
    cmds:
      - docker compose up -d

  docker:down:
    dir: '{{.USER_WORKING_DIR}}/docker/local'
    cmds:
      - docker compose down

  docker:purge:
    dir: '{{.USER_WORKING_DIR}}/docker/local'
    cmds:
      - docker compose down -v

  db:migrate:
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      MIGRATE_DSN: '{{if .TORCHWOOD_DATA_DATABASE_SOURCE}}{{.TORCHWOOD_DATA_DATABASE_SOURCE}}{{else}}postgres://{{default "torchwood" .POSTGRES_USER}}:{{default "torchwood" .POSTGRES_PASSWORD}}@{{default "127.0.0.1" .POSTGRES_HOST}}:{{default "5432" .POSTGRES_PORT}}/{{default "torchwood" .POSTGRES_DB}}?sslmode=disable{{end}}'
    cmds:
      - migrate -path ./db/migrations -database "{{.MIGRATE_DSN}}" up

  wire:server:
    dir: '{{.USER_WORKING_DIR}}/cmd/server'
    cmds:
      - go mod tidy
      - go run -mod=mod github.com/google/wire/cmd/wire

  wire:worker:
    dir: '{{.USER_WORKING_DIR}}/cmd/worker'
    cmds:
      - go mod tidy
      - go run -mod=mod github.com/google/wire/cmd/wire

  wire:dispatcher:
    dir: '{{.USER_WORKING_DIR}}/cmd/functions-dispatcher'
    cmds:
      - go mod tidy
      - go run -mod=mod github.com/google/wire/cmd/wire

  wire:all:
    cmds:
      - task: wire:server
      - task: wire:worker
      - task: wire:dispatcher

  generate:all:
    cmds:
      - task: generate:proto
      - task: generate:config
      - task: wire:all

  gen:authz-matrix:
    desc: 生成 docs/developer/authz-matrix.md（策略注册表派生，CI 字节级锁定）
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - go run ./cmd/server/internal/runtime/cmd/genauthzmatrix

  console:install:
    dir: '{{.USER_WORKING_DIR}}/console'
    cmds:
      - pnpm install

  console:build:
    dir: '{{.USER_WORKING_DIR}}/console'
    cmds:
      - pnpm run build

  console:dev:
    dir: '{{.USER_WORKING_DIR}}/console'
    cmds:
      - pnpm run dev

  sdk:install:
    dir: '{{.USER_WORKING_DIR}}/sdk/typescript'
    cmds:
      - npm install
      - npm --prefix ../demo install

  sdk:build:
    dir: '{{.USER_WORKING_DIR}}/sdk/typescript'
    cmds:
      - npm run build

  sdk:publish:
    dir: '{{.USER_WORKING_DIR}}/sdk/typescript'
    cmds:
      - npm publish

  sdk:demo:
    dir: '{{.USER_WORKING_DIR}}/sdk/demo'
    deps:
      - task: sdk:build
    cmds:
      - npm run dev

  sdk:demo-build:
    dir: '{{.USER_WORKING_DIR}}/sdk/demo'
    deps:
      - task: sdk:build
    cmds:
      - npm ci
      - npm run build

  dev:server:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - go run ./cmd/server

  dev:worker:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - go run ./cmd/worker

  build:
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: console:build
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o ./bin/ ./cmd/server
      - go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o ./bin/ ./cmd/worker
      # functions-dispatcher：执行器 v2 独立分发进程（P0.5，compose 单独服务）
      - go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o ./bin/ ./cmd/functions-dispatcher
      - go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o ./bin/torchwood{{if eq .OS "Windows_NT"}}.exe{{end}} ./cmd/torchwood
    vars:
      VERSION:
        sh: git describe --tags --always
      COMMIT:
        sh: git rev-parse --short HEAD
      DATE:
        sh: '{{if eq .OS "Windows_NT"}}powershell -NoProfile -Command Get-Date -Format "yyyyMMddHHmmss"{{else}}date +%Y%m%d%H%M%S{{end}}'

  test:sdk-go:
    dir: '{{.USER_WORKING_DIR}}/sdk/go'
    cmds:
      - go test -v ./... -cover

  test:sdk-ts:
    dir: '{{.USER_WORKING_DIR}}/sdk/typescript'
    cmds:
      - npm ci
      - npm run test

  test:
    deps:
      # lint:golangci 与 CI Backend job 同拦（gosec 曾只被 CI 拦下，本地裸跑
      # go test 全绿仍翻车）；vet/gofmt 归 lint:go。
      - task: lint:go
      - task: lint:golangci
      - task: test:sdk-go
      - task: test:sdk-ts
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      # -race 与 CI 对齐（J6-1）；集成测试依赖 .env 中的 TORCHWOOD_TEST_* 变量。
      - go test -race -v ./... -cover

  lint:go:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)"

  # 全量门禁（J6-3 后无棘轮；存量暂挂项见 .golangci.yml 的 exclusions 注释）。
  lint:golangci:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - golangci-lint run ./...

  lint:sdk-go:
    dir: '{{.USER_WORKING_DIR}}/sdk/go'
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)"

  lint:console:
    dir: '{{.USER_WORKING_DIR}}/console'
    cmds:
      - pnpm lint

  lint:
    deps:
      - task: lint:go
      - task: lint:golangci
      - task: lint:sdk-go
      - task: lint:console

  docker:build:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - docker build -t {{.DOCKER_IMAGE}} .
    vars:
      GIT_VERSION:
        sh: git describe --tags --always
      VERSION: 1.0.0
      TIMESTAMP:
        sh: '{{if eq .OS "Windows_NT"}}powershell -NoProfile -Command Get-Date -Format "yyyyMMddHHmmss"{{else}}date +%Y%m%d%H%M%S{{end}}'
      DOCKER_IMAGE: 'torchwood:{{.VERSION}}-{{.GIT_VERSION}}-{{.TIMESTAMP}}'
