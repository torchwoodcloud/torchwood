# 镜像发布流水线：GitHub Actions 构建仓库根 Dockerfile → 推 GHCR
# （ghcr.io/torchwoodcloud/torchwood）。
#
# 背景：Dokploy/小内存 VPS 上 `docker compose build` 会在 go build 多个二进制
# 时触发 OOM（部署进程被内核杀死，状态表现为 cancelled 而非 error）。改为
# CI 预构建、部署机仅 pull（docker/dokploy/docker-compose.yml 的
# pull_policy: always），Redeploy 即取 main 最新镜像。
#
# tag 策略（docker/metadata-action）：
#   - main 分支每次构建 → latest + sha-<short>（sha tag 供回滚钉版本）
#   - v* tag            → vX.Y.Z + vX.Y
# 首次发布后 GHCR 包默认私有：改为 Public（org → Packages → torchwood →
# Package settings），或让部署机 docker login ghcr.io（PAT read:packages）。
#
# 版本元数据经 build-args 注入 -ldflags（main.version/commit/date），由
# GET /v1/server/health/version 暴露；本地 mise run docker:build 不传参时为
# dev/unknown，行为不变。

name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: torchwoodcloud/torchwood

jobs:
  build-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本元数据：tag 构建用 tag 名（vX.Y.Z），分支构建用 sha-<short>；
      # 与 mise run build 的 git describe/短 commit/UTC 时间戳形态对齐。
      - id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}

  # 契约镜像（五期镜像部署源）：官方 BYO 基座 + 最小可运行示例。
  # 首次发布后 GHCR 包默认私有 → 需在 GitHub 包设置改为 Public（dev/部署机
  # 匿名拉取）；context = 仓库根（基座 COPY internal/ 下的 runner.js）。
  contract-images:
    name: Build & push contract images (BYO base + hello)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) 官方契约基座：用户 Dockerfile FROM 本镜像 + COPY 代码即得合规镜像
      - name: functions-runtime-node (contract base)
        run: |
          docker build -f docker/functions-runtime-node/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-runtime-node:1 \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-runtime-node:latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-runtime-node:1
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-runtime-node:latest

      # 2) 最小可运行示例（FROM 上一步推送的基座；login 已含 ghcr 凭证）
      - name: functions-hello (example image)
        run: |
          docker build -f docker/functions-hello/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-hello:v1 \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-hello:latest .
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-hello:v1
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/functions-hello:latest

  # 部署回调：镜像全部推送成功后调 Dokploy API（compose.deploy）触发部署。
  # 为什么用 API 而不是 webhook（2026-09-21 排障定案，源码
  # pages/api/deploy/compose/[refreshToken].ts + server/api/routers/compose.ts）：
  # - webhook 按 GitHub push event 契约校验（x-github-event 头 + body.ref），
  #   且受 compose 的 Autodeploy 总闸管辖（关闸即 400 disabled）——总闸开着
  #   又会导致 push 自动部署与 CI 推镜像竞态（拉到上一轮 latest）。
  # - compose.deploy API 只做权限检查、不读 autoDeploy 开关（等价面板 Deploy
  #   按钮），因此 Dokploy 侧 Autodeploy 保持关闭：push 不自动部署，由本 job
  #   在镜像推完后精确触发一次，git pull 同 commit compose + 拉新 latest，
  #   镜像与配置天然同版本；任一构建 job 失败则不部署。
  # secrets：DOKPLOY_API_TOKEN（面板 API Keys 创建）；composeId 为面板地址栏
  # services/compose/<id> 段（非敏感，硬编码；注意不是 webhook URL 里的
  # refreshToken）。
  # 仅 main 分支自动部署：v* tag 发布的 compose 取默认分支文件、可能与
  # tag 代码有出入，tag 发布手动 Redeploy。
  deploy:
    name: Trigger Dokploy deploy
    needs: [build-push, contract-images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: http://dokploy.deeploop.net:3000
      DOKPLOY_COMPOSE_ID: "9hJe2ifSfp9ckiiN4ynFz"
    steps:
      - name: Trigger Dokploy deploy (compose.deploy)
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "${{ github.event.head_commit.message }}" \
            --arg desc "image sha-${GITHUB_SHA::7}" \
            '{composeId: $composeId, title: $title, description: $desc}')
          response=$(curl -sS -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
            -w '\n%{http_code}')
          code=$(tail -n1 <<<"$response")
          body=$(sed '$d' <<<"$response")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Dokploy deploy API failed with HTTP $code: $body"
            exit 1
          fi
          echo "deploy accepted (HTTP $code): $body"
