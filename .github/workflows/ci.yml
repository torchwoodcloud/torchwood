name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 与 docker/local/docker-compose.yml 对齐：Percona Distribution for
        # PostgreSQL 18（内置 pgvector 0.8.3，≥0.8 满足 iterative scan 契约）。
        # 曾用 pgvector/pgvector:0.8.6-pg18——iterative scan 行为与 0.8.3 有
        # 差异（HNSW 高 ef 召回反而空结果，vector_ef_search 单调性断言
        # CI 必败本地绿），且 locale=C 时 initdb 默认服务端编码是 SQL_ASCII，
        # pgdriver（bun ≥1.2.16）握手期校验 client_encoding=UTF8 直接拒连，
        # 故必须显式 --encoding=UTF8（编码只在首次 initdb 生效，CI 每轮全新
        # 容器必踩）。
        image: percona/percona-distribution-postgresql:18
        env:
          POSTGRES_USER: torchwood
          POSTGRES_PASSWORD: torchwood
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torchwood"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        # SILO（pgsty/silo，MinIO 社区延续分支），与 docker/local/docker-compose.yml
        # 的本地版本对齐（不追 latest）。
        image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # 函数实例注册表（torchwood:fninst:*）真 Redis 集成测试用
        # （dispatcher/registry_redis_integration_test.go），
        # 版本对齐 docker/local/docker-compose.yml（不追 latest）。
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TORCHWOOD_TEST_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/TORCHWOOD_test?sslmode=disable
      TORCHWOOD_TEST_REDIS_ADDR: localhost:6379
      TORCHWOOD_TEST_ADMIN_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/postgres?sslmode=disable
      TORCHWOOD_TEST_MINIO_ENDPOINT: http://localhost:9000
      TORCHWOOD_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking 需要 origin/main 可解析。
          fetch-depth: 0

      # 工具链唯一来源：mise.toml（go / node / pnpm / buf / protoc /
      # protoc-gen-go / golangci-lint 全钉版本，与本地完全一致）。
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      # Go 模块与构建缓存（替代原 actions/setup-go 的 cache: true）
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # pnpm store 缓存（与 frontend job 同 key 共享）
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Buf lint
        run: buf lint

      - name: Buf breaking (proto field drift)
        run: buf breaking --against '.git#branch=origin/main'

      - name: Pre-pull function runtime base images
        run: docker pull node:18-alpine

      - name: Format check (gofmt) + go vet
        run: mise run lint:go

      # J6-3：全量门禁（存量暂挂项见 .golangci.yml 的 exclusions 注释）。
      - name: golangci-lint
        run: mise run lint:golangci

      # J6-1：race 与 coverage 合并跑（-covermode=atomic 为 race 兼容模式），
      # 避免拆独立 job 重复付出集成测试成本。
      - name: Tests (unit + integration, race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # A7（转出 POC 门禁）：RLS 性能相对基准常驻 CI——documentdb RLS 开/关
      # 计数比值超过阈值（30x，见 rls_policy_test.go）即失败。绝对 P99 数值
      # 门禁需 CI 专用基准规格（百万行级数据灌入），转出 POC 后上线
      #（15-exit-poc A7 登记此分界）。
      - name: RLS performance relative benchmark (A7)
        run: go test ./internal/infra/documentdb/ -run 'TestRLS_RelativeBenchmark|TestRLS_ExplainInitPlanGate' -count=1 -v


      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "total coverage: ${total}%"
          # 阈值依据：main 实测 51.1%（2026-08-24，含 docker/MinIO 集成测试），
          # 向下取整后留 3 个百分点缓冲吸收批次间波动；只升不降，随存量清零上调。
          threshold=48
          awk -v t="$threshold" -v c="$total" 'BEGIN { exit (c + 0 >= t) ? 0 : 1 }' || {
            echo "::error::coverage ${total}% is below the ${threshold}% gate" >&2
            exit 1
          }

      # J6-5：functions docker e2e 防假绿——daemon 不可达时该组测试静默 skip
      # 且整体显示 ok。取舍：用 -run 前缀重跑该组并断言无 --- SKIP，而非解析
      # 主测试步骤的 go test -json 输出（避免改动主步骤输出管道）。
      - name: Assert functions docker e2e executed
        run: |
          set -euo pipefail
          out=$(go test -v -count=1 -run 'TestDockerExecutor_' ./internal/infra/functions)
          echo "$out"
          if grep -q '^--- SKIP' <<<"$out"; then
            echo "::error::functions docker e2e skipped; check docker daemon and TORCHWOOD_RUN_DOCKER_TESTS"
            exit 1
          fi

      - name: SDK Go tests (independent module)
        working-directory: sdk/go
        run: go test -race ./...

      - name: Codegen drift check
        run: |
          set -e
          # 工具链版本由 mise.toml 钉住（protoc 31.1 + protoc-gen-go 1.36.11，
          # 与 config.pb.go 头注释一致），与本地同源。
          mise run generate:all
          git diff --exit-code -- genproto internal/pkg/config cmd go.mod go.sum

      - name: TS SDK test
        working-directory: sdk/typescript
        run: npm ci && npm run test

      - name: SDK demo build
        run: mise run sdk:demo-build

      # mise run build 依赖 console:build，需要 console 依赖已安装
      - name: Install console deps
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: Build (console + server embed)
        run: mise run build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      # pnpm store 缓存（替代原 actions/setup-node 的 cache: pnpm）
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm build

  # 飞书通知（共用 .github/actions/feishu-notify）：CI 只在失败时推送——
  # 成功是常态噪音，main 的成功随后由 Image 流水线的成功通知覆盖；
  # fork PR 拿不到 secrets，action 内部自动跳过。
  notify:
    name: Feishu notify
    needs: [backend, frontend]
    if: ${{ !cancelled() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/feishu-notify
        with:
          status: failure
          detail: backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
