name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 与 docker/local/docker-compose.yml 对齐：pgvector 0.8.6 + PG18
        # （vector 列 + HNSW 索引，iterative scan 需 ≥0.8）。locale=C 对齐
        # 原 alpine 镜像的排序语义（Debian 基座默认 en_US.utf8）。
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: torchwood
          POSTGRES_PASSWORD: torchwood
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: "--locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torchwood"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        # SILO（pgsty/silo，MinIO 社区延续分支），与 docker/local/docker-compose.yml
        # 的本地版本对齐（不追 latest）。
        image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TORCHWOOD_TEST_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/TORCHWOOD_test?sslmode=disable
      TORCHWOOD_TEST_ADMIN_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/postgres?sslmode=disable
      TORCHWOOD_TEST_MINIO_ENDPOINT: http://localhost:9000
      TORCHWOOD_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking 需要 origin/main 可解析。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: v1.65.0

      - name: Buf lint
        run: buf lint

      - name: Buf breaking (proto field drift)
        run: buf breaking --against '.git#branch=origin/main'

      - name: Pre-pull function runtime base images
        run: docker pull node:18-alpine && docker pull python:3.11-alpine

      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      # J6-3：全量门禁（存量暂挂项见 .golangci.yml 的 exclusions 注释）。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          args: ./...

      # J6-1：race 与 coverage 合并跑（-covermode=atomic 为 race 兼容模式），
      # 避免拆独立 job 重复付出集成测试成本。
      - name: Tests (unit + integration, race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # A7（转出 POC 门禁）：RLS 性能相对基准常驻 CI——documentdb RLS 开/关
      # 计数比值超过阈值（30x，见 rls_policy_test.go）即失败。绝对 P99 数值
      # 门禁需 CI 专用基准规格（百万行级数据灌入），转出 POC 后上线
      #（15-exit-poc A7 登记此分界）。
      - name: RLS performance relative benchmark (A7)
        run: go test ./internal/infra/documentdb/ -run 'TestRLS_RelativeBenchmark|TestRLS_ExplainInitPlanGate' -count=1 -v


      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "total coverage: ${total}%"
          # 阈值依据：main 实测 51.1%（2026-08-24，含 docker/MinIO 集成测试），
          # 向下取整后留 3 个百分点缓冲吸收批次间波动；只升不降，随存量清零上调。
          threshold=48
          awk -v t="$threshold" -v c="$total" 'BEGIN { exit (c + 0 >= t) ? 0 : 1 }' || {
            echo "::error::coverage ${total}% is below the ${threshold}% gate" >&2
            exit 1
          }

      # J6-5：functions docker e2e 防假绿——daemon 不可达时该组测试静默 skip
      # 且整体显示 ok。取舍：用 -run 前缀重跑该组并断言无 --- SKIP，而非解析
      # 主测试步骤的 go test -json 输出（避免改动主步骤输出管道）。
      - name: Assert functions docker e2e executed
        run: |
          set -euo pipefail
          out=$(go test -v -count=1 -run 'TestDockerExecutor_' ./internal/infra/functions)
          echo "$out"
          if grep -q '^--- SKIP' <<<"$out"; then
            echo "::error::functions docker e2e skipped; check docker daemon and TORCHWOOD_RUN_DOCKER_TESTS"
            exit 1
          fi

      - name: SDK Go tests (independent module)
        working-directory: sdk/go
        run: go test -race ./...

      - name: Codegen drift check
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go build -o "$(go env GOPATH)/bin/protoc-gen-go" google.golang.org/protobuf/cmd/protoc-gen-go
          buf generate
          (cd internal/pkg/config && protoc -I. --go_out=. --go_opt=paths=source_relative ./config.proto)
          task wire:all
          git diff --exit-code -- genproto internal/pkg/config cmd go.mod go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TS SDK test
        working-directory: sdk/typescript
        run: npm ci && npm run test

      - name: SDK demo build
        run: task sdk:demo-build

      - name: Build (console + server embed)
        run: task build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm build
