syntax = "proto3";

package torchwood.api.config;

option go_package = "github.com/torchwooddev/torchwood/internal/pkg/config";

message AppConfig {
  Server server = 1;
  Security security = 2;
  Data data = 3;
  Storage storage = 4;
  Functions functions = 5;
  Telemetry telemetry = 6;
  Messaging messaging = 7;
  IdGen idgen = 8;
  Payments payments = 9;
}

message Server {
  GRPC grpc = 1;
  Http http = 2;
  Http metrics = 3;
}

message GRPC {
  string addr = 1;
  string timeout = 2;
}

message Http {
  message Cors {
    repeated string allow_origins = 1;
    repeated string allow_methods = 2;
    repeated string allow_headers = 3;
    repeated string expose_headers = 4;
    bool allow_credentials = 5;
    int32 max_age = 6;
  }
  string addr = 1;
  string timeout = 2;
  Cors cors = 3;
  // Public base URL used to construct OAuth redirect URIs, e.g. https://api.example.com
  string public_url = 4;
}

message Security {
  message Jwt {
    string secret = 1;
    string access_ttl = 2;
    string refresh_ttl = 3;
  }
  message ApiKey {
    string header = 1;
  }
  message Sessions {
    // 单用户最大并发会话数（end-user sessions）；未配置/0 = 默认 50；-1 = 不限。
    int32 max_per_user = 1;
  }
  message RateLimit {
    message Dimension {
      // 每窗口允许的最大请求数；未配置/<=0 使用拦截器内置默认值。
      int32 limit = 1;
      // 窗口时长字符串（如 "60s"）；未配置/非法格式使用拦截器内置默认值。
      string window = 2;
    }
    // 通用 API 限流总开关；默认 true（未显式配置为 false 即开启）。
    optional bool enabled = 1;
    Dimension ip = 2;
    Dimension user = 3;
    Dimension api_key = 4;
  }
  Jwt jwt = 1;
  ApiKey api_key = 2;
  // Trusted proxy CIDRs (e.g. 10.0.0.0/8). Only peers matching these ranges
  // may supply X-Forwarded-For / X-Real-Ip; otherwise the peer address is used.
  repeated string trusted_proxies = 3;
  // Console bootstrap token required to sign up the first admin. When empty,
  // Console SignUp is rejected (prevents setup takeover).
  string setup_token = 4;
  Sessions sessions = 5;
  RateLimit rate_limit = 6;
  // Static data-encryption key (OAuth client secrets / TOTP secrets, secretbox
  // AES-256-GCM). Independent from jwt.secret; when empty the JWT secret is
  // used as fallback (startup warns). env: TORCHWOOD_SECURITY_ENCRYPTION_KEY
  string encryption_key = 7;
  // 认证面局部频控（T-01）：登录失败双维计数 + 注册 IP 频控。均按"失败
  // 计数 + 滑动窗口"语义，成功登录/注册重置相关键；未配置的维度使用
  // 内置默认值（email/ip 各 5 次/60s，signup_ip 10 次/小时）。
  LoginThrottle login_throttle = 8;

  message LoginThrottle {
    // 按账号（email 小写规范化）维度的失败计数上限与窗口。
    RateLimit.Dimension email = 1;
    // 按来源 IP 维度的失败计数上限与窗口（经 trusted-proxy 校验后的 IP）。
    RateLimit.Dimension ip = 2;
    // SignUp 按来源 IP 的注册频控上限与窗口。
    RateLimit.Dimension signup_ip = 3;
    // X-API-Key 认证失败按来源 IP 的频控（T-02；默认 10 次/60s）。
    RateLimit.Dimension api_key_auth = 4;
  }
}

message Database {
  message Pool {
    int32 max_idle_conns = 1;
    int32 max_open_conns = 2;
    string conn_max_lifetime = 3;
    string conn_max_idle_time = 4;
  }
  string source = 1;
  bool debug = 2;
  Pool pool = 3;
  // 慢查询日志阈值（如 "500ms"）；空字符串 = 默认 500ms；"0" = 禁用。
  string slow_query_threshold = 4;
}

message Redis {
  string addr = 1;
  string password = 2;
  int32 db = 3;
}

message Data {
  Database database = 1;
  Redis redis = 2;
}

message Storage {
  message S3 {
    string endpoint = 1;
    string region = 2;
    string bucket = 3;
    string access_key_id = 4;
    string secret_access_key = 5;
    bool use_ssl = 6;
  }
  message Local {
    string path = 1;
  }
  string provider = 1;
  S3 s3 = 2;
  Local local = 3;
}

message Functions {
  message Docker {
    string host = 1;
    string network = 2;
    string registry = 3;
  }
  string executor = 1;
  Docker docker = 2;
}

message Telemetry {
  bool enabled = 1;
  string otlp_endpoint = 2;
  string service_name = 3;
}

message Messaging {
  message SMTP {
    string host = 1;
    int32 port = 2;
    string username = 3;
    string password = 4;
    string from = 5;
    bool use_tls = 6;
  }
  SMTP smtp = 1;
  // When true and SMTP host is empty, OTP codes are written to the application log (development only).
  bool dev_log_otp = 2;
  SMS sms = 3;
  // When true and SMS provider is empty, OTP codes are written to the application log (development only).
  bool dev_log_sms = 4;
}

message SMS {
  string provider = 1; // twilio
  Twilio twilio = 2;
}

message Twilio {
  string account_sid = 1;
  string auth_token = 2;
  string from = 3;
}

message IdGen {
  message Random {
    int32 length = 1;
    string charset = 2; // numeric | alphanumeric
    string redis_key_prefix = 3;
    int32 max_retries = 4;
  }
  message Snowflake {
    int32 node_id = 1;
  }
  message Sequence {
    string redis_key_prefix = 1;
  }
  message Resources {
    string users = 1;
    string sessions = 2;
    string documents = 3;
  }
  string default_strategy = 1; // uuid | ulid | snowflake | sequence | random
  Random random = 2;
  Snowflake snowflake = 3;
  Sequence sequence = 4;
  Resources resources = 5;
}

// Payments 是 v3 支付子域配置（设计 §1.2）。渠道 secret 一律走
// TORCHWOOD_ 环境变量，不写入 config.yaml；未配置时服务可启动，
// 相关操作 fail-closed。
message Payments {
  message Stripe {
    // Secret key (sk_...). env: TORCHWOOD_PAYMENTS_STRIPE_SECRET_KEY
    string secret_key = 1;
    // Webhook signing secret (whsec_...). env: TORCHWOOD_PAYMENTS_STRIPE_WEBHOOK_SECRET
    string webhook_secret = 2;
    // REST API base URL; empty = https://api.stripe.com (tests may override).
    string api_base_url = 3;
  }
  message WeChat {
    string mch_id = 1;
    string app_id = 2;
    // APIv3 密钥（32 字节，回调 AES-256-GCM 解密）。env: TORCHWOOD_PAYMENTS_WECHAT_API_V3_KEY
    string api_v3_key = 3;
    // 商户 API 证书序列号。env: TORCHWOOD_PAYMENTS_WECHAT_MERCHANT_SERIAL_NO
    string merchant_serial_no = 4;
    // 商户 API 私钥 PEM。env: TORCHWOOD_PAYMENTS_WECHAT_MERCHANT_PRIVATE_KEY
    string merchant_private_key = 5;
    // 微信支付平台证书 PEM（验签）。env: TORCHWOOD_PAYMENTS_WECHAT_PLATFORM_CERT
    string platform_cert = 6;
    // 可选：覆盖回调 URL；空则用 server.http.public_url + /v1/payments/callbacks/wechat。
    string notify_url = 7;
    // REST API base URL; empty = https://api.mch.weixin.qq.com（tests may override）。
    string api_base_url = 8;
  }
  message Alipay {
    string app_id = 1;
    // 应用私钥 PEM。env: TORCHWOOD_PAYMENTS_ALIPAY_APP_PRIVATE_KEY
    string app_private_key = 2;
    // 支付宝公钥 PEM。env: TORCHWOOD_PAYMENTS_ALIPAY_ALIPAY_PUBLIC_KEY
    string alipay_public_key = 3;
    // 可选：覆盖回调 URL；空则用 server.http.public_url + /v1/payments/callbacks/alipay。
    string notify_url = 4;
    // 开放平台网关; empty = https://openapi.alipay.com/gateway.do。
    string gateway_url = 5;
  }
  message IosIap {
    string bundle_id = 1;
    // verifyReceipt shared secret。env: TORCHWOOD_PAYMENTS_IOS_IAP_SHARED_SECRET
    string shared_secret = 2;
    // App Store Connect API（StoreKit 2 / ASN 备用）issuer。
    string issuer_id = 3;
    string key_id = 4;
    // App Store Connect API .p8 PEM。env: TORCHWOOD_PAYMENTS_IOS_IAP_PRIVATE_KEY
    string private_key = 5;
    // Apple Root CA PEM（可多张）；空则使用内置 Apple Root CA - G3。
    // env: TORCHWOOD_PAYMENTS_IOS_IAP_APPLE_ROOT_CERT
    string apple_root_cert = 6;
    // verifyReceipt 生产地址；空 = https://buy.itunes.apple.com/verifyReceipt。
    string verify_receipt_url = 7;
    // verifyReceipt 沙盒地址；空 = https://sandbox.itunes.apple.com/verifyReceipt。
    string sandbox_verify_url = 8;
  }
  Stripe stripe = 1;
  WeChat wechat = 2;
  Alipay alipay = 3;
  IosIap ios_iap = 4;
}
