syntax = "proto3";

package torchwood.api.config;

option go_package = "github.com/torchwoodcloud/torchwood/internal/pkg/config";

message AppConfig {
  Server server = 1;
  Security security = 2;
  Data data = 3;
  Storage storage = 4;
  Functions functions = 5;
  Messaging messaging = 7;
  IdGen idgen = 8;
  Payments payments = 9;
  Analytics analytics = 10;
}

message Server {
  GRPC grpc = 1;
  Http http = 2;
  Http metrics = 3;
}

message GRPC {
  string addr = 1;
  string timeout = 2;
}

message Http {
  message Cors {
    repeated string allow_origins = 1;
    repeated string allow_methods = 2;
    repeated string allow_headers = 3;
    repeated string expose_headers = 4;
    bool allow_credentials = 5;
    int32 max_age = 6;
  }
  string addr = 1;
  string timeout = 2;
  Cors cors = 3;
  // Public base URL used to construct OAuth redirect URIs, e.g. https://api.example.com
  string public_url = 4;
}

message Security {
  message Jwt {
    string secret = 1;
    string access_ttl = 2;
    string refresh_ttl = 3;
  }
  message ApiKey {
    string header = 1;
  }
  message Sessions {
    // 单用户最大并发会话数（end-user sessions）；未配置/0 = 默认 50；-1 = 不限。
    int32 max_per_user = 1;
  }
  message RateLimit {
    message Dimension {
      // 每窗口允许的最大请求数；未配置/<=0 使用拦截器内置默认值。
      int32 limit = 1;
      // 窗口时长字符串（如 "60s"）；未配置/非法格式使用拦截器内置默认值。
      string window = 2;
    }
    // 通用 API 限流总开关；默认 true（未显式配置为 false 即开启）。
    optional bool enabled = 1;
    Dimension ip = 2;
    Dimension user = 3;
    Dimension api_key = 4;
    // 函数执行身份维度（P0）：按 project:function 计数，默认对齐 api-key
    // 档 6000/min；必须在 user 维度回落之前特判（每次执行独立 ActorID，
    // 落 user 维度 = 实质不限流；全部容器经 bridge NAT 同 IP，落 IP 维度
    // = 互相击穿）。见 internal/api/interceptor/ratelimit.go。
    Dimension functions_execution = 5;
  }
  Jwt jwt = 1;
  ApiKey api_key = 2;
  // Trusted proxy CIDRs (e.g. 10.0.0.0/8). Only peers matching these ranges
  // may supply X-Forwarded-For / X-Real-Ip; otherwise the peer address is used.
  repeated string trusted_proxies = 3;
  // Console bootstrap token required to sign up the first admin. When empty,
  // Console SignUp is rejected (prevents setup takeover).
  string setup_token = 4;
  Sessions sessions = 5;
  RateLimit rate_limit = 6;
  // Static data-encryption key (OAuth client secrets / TOTP secrets, secretbox
  // AES-256-GCM). Independent from jwt.secret; when empty the JWT secret is
  // used as fallback (startup warns). env: TORCHWOOD_SECURITY_ENCRYPTION_KEY
  string encryption_key = 7;
  // 认证面局部频控（T-01）：登录失败双维计数 + 注册 IP 频控。均按"失败
  // 计数 + 滑动窗口"语义，成功登录/注册重置相关键；未配置的维度使用
  // 内置默认值（email/ip 各 5 次/60s，signup_ip 10 次/小时）。
  LoginThrottle login_throttle = 8;

  message LoginThrottle {
    // 按账号（email 小写规范化）维度的失败计数上限与窗口。
    RateLimit.Dimension email = 1;
    // 按来源 IP 维度的失败计数上限与窗口（经 trusted-proxy 校验后的 IP）。
    RateLimit.Dimension ip = 2;
    // SignUp 按来源 IP 的注册频控上限与窗口。
    RateLimit.Dimension signup_ip = 3;
    // X-API-Key 认证失败按来源 IP 的频控（T-02；默认 10 次/60s）。
    RateLimit.Dimension api_key_auth = 4;
  }
}

message Database {
  message Pool {
    int32 max_idle_conns = 1;
    int32 max_open_conns = 2;
    string conn_max_lifetime = 3;
    string conn_max_idle_time = 4;
  }
  string source = 1;
  bool debug = 2;
  Pool pool = 3;
  // 慢查询日志阈值（如 "500ms"）；空字符串 = 默认 500ms；"0" = 禁用。
  string slow_query_threshold = 4;
}

message Redis {
  string addr = 1;
  string password = 2;
  int32 db = 3;
}

message Data {
  Database database = 1;
  Redis redis = 2;
}

message Storage {
  message S3 {
    string endpoint = 1;
    string region = 2;
    string bucket = 3;
    string access_key_id = 4;
    string secret_access_key = 5;
    bool use_ssl = 6;
  }
  message Local {
    string path = 1;
  }
  string provider = 1;
  S3 s3 = 2;
  Local local = 3;
}

message Functions {
  message Docker {
    string host = 1;
    string network = 2;
    string registry = 3;
  }
  // Execution 是执行身份（P0）相关配置：函数容器经 bridge NAT 回访
  // Server API 只能走外部端点（server 不在 tw-func-<project> 网络上），
  // 平台经 TW_API_BASE_URL env 注入可达地址；空 = 不注入该变量（函数
  // 需自行解析，自托管部署文档要求显式配置）。
  message Execution {
    string api_base_url = 1;
  }
  // Dispatcher 是分发通路配置（owner 拍板方案③：独立 dispatcher
  // 进程专职持有 docker.sock、join 项目网络、承接 Build/Execute/RemoveImage
  // 全部 daemon 操作；server/worker 零 daemon 依赖）。
  message Dispatcher {
    // dispatcher 的内网 HTTP 基址（server/worker 侧消费），如
    // http://dispatcher:9070。必填（组合根启动期校验）。
    string url = 1;
    // 静态共享密钥（内网专用可选认证；空 = 不校验，仅限可信内网）。
    string shared_token = 2;
    // ——以下仅 dispatcher 进程消费（池策略全局参数）——
    // 每 daemon 常驻实例总量上限（设计 Q11 拍板 8，2026-09-21 上调缺省
    // 16：Agent-Native 高并发场景默认容量翻倍；内存敞口随实例数线性放大，
    // 全 shared-1x ≈4GiB、全 shared-2x ≈8GiB，自托管按宿主余量回调）。
    // 防单项目耗尽宿主内存的语义不变。
    int32 max_resident_instances = 3;
    // 单函数有界排队深度上限（超限立即 ResourceExhausted；默认 32）。
    int32 queue_depth = 4;
    // 队首超时：等待空闲实例的最长时间（如 "10s"；默认 10s，超时
    // ResourceExhausted——同步调用方不得无界等在 30s ctx 上）。
    string queue_head_timeout = 5;
    // 实例启动健康探针等待上限（如 "60s"；默认 60s，超时回收并报错）。
    string boot_timeout = 6;
    // dispatcher HTTP 监听地址（仅内网；默认 ":9070"）。
    string addr = 7;
    // 函数网络内需可达的 server 容器名（如 compose 的 container_name）。
    // 非空时，dispatcher 在 join 项目网络（含 internal 变体）的同时把该
    // 容器一并 attach——函数经容器名 DNS 回访平台 API
    // （functions.execution.api_base_url = http://<该名字>:<端口>）。
    // 不可信函数在 internal 网络（无 NAT 出口），这是其回访平台的唯一通路；
    // 容器名 DNS 在 user-defined 网络（含 internal）上由内置 DNS 解析。
    // attach 失败不阻断执行（函数可能无需回访），但会记警告——部署时应
    // 在首次执行前修正。空 = 不 attach（api_base_url 须另行保证可达）。
    string callback_container = 8;
    // 实例累计超时熔断阈值（functions v3 §1.4：超时不杀实例后，实例累计
    // 超时达到该阈值即杀实例重建，防僵尸负载慢性塞满事件循环；默认 5）。
    uint32 timeout_budget = 9;
    // 部署构建整体超时（如 "5m"；默认 5m，对齐 worker 补构建）。构建 ctx
    // 与客户端断开解耦（WithoutCancel），由该值封顶；Go 冷构建（基础镜像
    // 拉取数百 MB + go mod download + 编译）在全新环境可逼近该默认值，
    // 必要时按 runtime 分档调大。空/非法值回落默认。
    string build_timeout = 10;
    // 部署后验证 spawn（build 成功后起池外实例轮询 /_tw/health 的质量门；
    // Go 强制、node 同开）。optional presence 语义：未配置 = 默认开启，
    // 显式 false = 关闭（先例：security.rate_limit.enabled）。
    optional bool verify_build = 11;
    // 本 dispatcher 进程的节点 ID（四期 4a-1 多机细胞模型，设计
    // functions-runtimes-and-sources.md §4 M2/M5）：节点注册表
    // （torchwood:fnnodes:*）与构建亲和（function_deployments.build_node）
    // 的节点标识。空 = os.Hostname 兜底。
    string node_id = 12;
    // 本节点对等互达的 dispatcher URL（M3 执行路由的寻址基准，4a-2 消费），
    // 如 http://dispatcher-1:9070。空 = "http://127.0.0.1:" + addr 端口推导
    // （仅单机部署成立）。**多机部署必须显式配置**：跨节点回连地址无法从
    // 监听地址推导（127.0.0.1 对其他节点不可达）。routing_mode="registry"
    // 时必填（启动期校验——对等必须能反连本节点，推导地址跨节点不可达）。
    string node_url = 13;
    // 执行路由模式（四期 4b M7，设计 §4 三档模型的两档可实现形态）：
    //   - "local"（缺省，向后兼容）：镜像不分发——函数镜像只存在于其构建
    //     节点，冷启动转发 BuildNode（4a-2 语义）；
    //   - "registry"：M1 镜像全局化——构建成功后 push
    //     functions.docker.registry，任意节点冷启动本地 miss 则 pull 后本地
    //     spawn（跨节点冷启动自愈解锁；实例亲和转发语义不变）。
    // 其他值启动期 ValidateFunctionsDispatchConfig 拒绝。设计中的
    // "replicated" 实验档不在实现范围（设计 §4 M7 降档裁决）。
    string routing_mode = 14;
    // 构建成功（含验证 spawn 通过）后把镜像 push 到
    // functions.docker.registry（M1；此时该前缀从命名前缀升格为真实
    // registry）。routing_mode="registry" 时必须显式 true（启动期校验——
    // 镜像全局化是该模式的硬前提）；local 模式忽略该值（镜像不分发，
    // 配 true 也不 push）。默认 false。
    bool registry_push = 15;
    // 全集群常驻实例总量上限（四期 4c M4 容量共享，设计 §4）：多节点部署下
    // max_resident_instances 只是每节点各管各的（进程内计数互不知），集群
    // 总量由 Redis 容量键 torchwood:fncap:resident:<node_id>（SET+TTL，值 =
    // 该节点当前常驻数）SCAN 求和约束，trySpawn 在本节点上限之后检查。
    // 0 = 不设全局上限（缺省；单机部署无需配置）。Redis 不可用时全局检查
    // fail-open 退化为仅本节点上限（容量门是可用性门不是安全门，限频告警；
    // 与 M8 死节点收敛的 fail-safe 语义方向相反，不得混淆）。
    uint32 max_resident_instances_global = 16;
    // 镜像缺失自动重建（执行链自愈）：执行分发命中「部署镜像在本节点缺失」
    // （宿主镜像被清理/环境迁移导致 Postgres ready 状态与宿主 docker 镜像
    // 存量漂移）时，server/worker 凭 FailedPrecondition + 稳定标记识别并
    // 异步触发该部署重建——zip/git 源以盘上 zip 重建；盘缺失时优先从
    // functions.storage 专用桶拉回复核（zip 源自愈主通路），git 源桶 miss
    // 再按行内源快照 URL+钉死 SHA+目录经 packer 重新物化并复核
    // ContextSHA256；image 源为幂等 ImportImage；桶未启用（存量部署/
    // zipStore 未注入）且 zip 源盘缺失时退回声明边界（执行错误文案含
    // rebuild required 引导 redeploy）。optional presence 语义：未配置 =
    // 默认开启，显式 false = 关闭。先例：verify_build。
    optional bool rebuild_on_missing_image = 17;
  }
  // executor（字段号 1）已删除：v1 docker 执行器（每请求一容器、进程内
  // docker.sock）已移除，函数执行统一经 dispatcher 分发。
  reserved 1;
  reserved "executor";
  Docker docker = 2;
  Execution execution = 3;
  Dispatcher dispatcher = 4;
  // Trigger 是触发器模块平台级配置（P1 触发器模块）。
  message Trigger {
    // HTTP 触发器 per-IP 固定窗口限频（次/分钟；默认 3000）。独立更高默认：
    // 微信等回调出口 IP 段集中，沿用全局 300/min 会在发奖风暴下 429 →
    // 重试耗尽 → 事件丢失（设计 §3 三轮复核）。
    int32 http_ip_per_minute = 1;
  }
  Trigger trigger = 5;
  // ClientInvoke 是客户端调用面平台级配置（P2 客户端调用面；per-function 的
  // 限频配额/窗口在 functions 表策略列上，不在本节）。
  message ClientInvoke {
    // 每用户并发闸门上限（默认 8，2026-09-21 上调原 2：Agent 场景单用户
    // 并发突发是常态，2 会在第 3 个请求就排队、5s 超时 429；防单用户挤占
    // 语义不变——真正防耗尽在 dispatcher 容量门）。进程内 keyed
    // 信号量——多实例部署下为近似全局（每实例各 8）。
    int32 per_user_concurrency = 1;
    // 并发闸门排队队首超时（如 "10s"；默认 10s——2026-09-21 上调原 5s，
    // 与 dispatcher 池队首超时口径一致，闸门先超时等于放行后仍要在池队列
    // 上白等；超时 ResourceExhausted——同步调用方不得无界等待）。
    string queue_head_timeout = 2;
  }
  ClientInvoke client_invoke = 6;
  // Packer 是 git 源打包服务（packer，二期阶段二）配置：独立
  // 进程把 git 仓库 @ref 物化为 zip 交回 server 落既有构建路径（zip 流向
  // 反转：packer → server；docs/design/functions-runtimes-and-sources.md
  // §2）。与 dispatcher 的构建信号量成两道独立闸、无嵌套；
  // clone 的内存尖峰/磁盘消耗全部收敛在 packer 进程（可独立重启/扩缩，
  // OOM 只影响 git 部署自身）。server 进程只消费 url/shared_token；
  // 其余字段仅 packer 进程消费（与 dispatcher 同款分段注释约定）。
  message Packer {
    // packer 的内网 HTTP 基址（server 侧消费），如
    // http://packer:9071。空 = git 部署源未启用（app 层 git
    // 部署报明确错误；zip 源完全不受影响，增量启用）。
    string url = 1;
    // 静态共享密钥（内网专用可选认证；空 = 不校验，仅限可信内网）。
    string shared_token = 2;
    // ——以下仅 packer 进程消费——
    // 单次 fetch+物化的整体超时（如 "120s"；默认 120s）。空/非法值回落
    // 默认。最坏损失上界 = 一次 ≤该值的失败 clone（设计 §2）。
    string fetch_timeout = 3;
    // 克隆 worktree 磁盘侧预算（字节；默认 209715200 = 200MiB）。
    int64 max_repo_bytes = 4;
    // 物化 zip 传输侧预算（字节；默认 52428800 = 50MiB，与构建内联通道
    // maxBuildBodyBytes 同源）。
    int64 max_zip_bytes = 5;
    // 并发打包上限（默认 4；饱和请求立即 429 ResourceExhausted）。
    uint32 concurrency = 6;
    // 放行 http:// 与私网/回环目标（SSRF guard 整体放行）。仅自托管内网
    // git 服务场景显式开启（给显式开关而非逼出危险旁路）；默认 false。
    bool allow_insecure = 7;
    // packer HTTP 监听地址（仅内网；默认 ":9071"，与 dispatcher 缺省
    // ":9070" 错开）。
    string addr = 8;
  }
  Packer packer = 9;
  // Image 是 BYO 镜像源（三期阶段三，docs/design/functions-runtimes-and-sources.md
  // §3）的 registry 准入配置：host 名称级校验在 dispatcher 侧
  // ImportImage 实施（pull 由宿主 docker daemon 执行，IP 拨号点 guard 不可
  // 实施于 daemon——故采用名称级校验 + 白名单 + 信任级论证：部署者 =
  // functions.write 特权主体；公网域名解析到内网的残余面诚实声明、随
  // egress 原语后置）。仅 dispatcher 进程消费。
  message Image {
    // registry host 正向白名单（空 = 不设白名单）：条目为精确域名或后缀域
    //（"example.com" 同时命中 "example.com" 与子域 "registry.example.com"，
    // 不命中 "badexample.com"；含端口的 host 需整体精确登记）。白名单命中
    // 优先放行——显式登记 = 运维明确意图（含内网 registry 直连 IP 的
    // 显式白名单场景）；白名单非空时未命中一律拒绝。
    repeated string allowed_registries = 1;
    // 放行 IP 字面量（IPv4/IPv6）与 localhost/*.localhost 形态的 registry
    // host（自托管内网 registry 场景显式开启，给显式开关而非逼出危险
    // 旁路）。默认 false。
    bool allow_insecure = 2;
  }
  Image image = 8;
  // Storage 是部署代码包持久层（zip 持久桶）配置：本地盘之外的对象存储
  // 副本——盘上 zip 丢失（磁盘清理/环境迁移/多节点不共享盘）时部署重建
  // 链路可从桶拉回复核后重建（zip 源自愈；git 源优先拉回、桶 miss 回退
  // packer 重物化）。桶为平台内部资源，不进用户 bucket 命名空间（项目
  // buckets 表无行、API 不可见）；连接复用 storage.s3 的 endpoint/凭证。
  message Storage {
    // 部署代码包专用物理桶名（空 = 缺省 torchwood-functions）。
    string bucket = 1;
  }
  Storage storage = 10;
}

message Messaging {
  message SMTP {
    string host = 1;
    int32 port = 2;
    string username = 3;
    string password = 4;
    string from = 5;
    bool use_tls = 6;
  }
  SMTP smtp = 1;
  // When true and SMTP host is empty, OTP codes are written to the application log (development only).
  bool dev_log_otp = 2;
  SMS sms = 3;
  // When true and SMS provider is empty, OTP codes are written to the application log (development only).
  bool dev_log_sms = 4;
}

message SMS {
  string provider = 1; // twilio
  Twilio twilio = 2;
}

message Twilio {
  string account_sid = 1;
  string auth_token = 2;
  string from = 3;
}

message IdGen {
  message Random {
    int32 length = 1;
    string charset = 2; // numeric | alphanumeric
    string redis_key_prefix = 3;
    int32 max_retries = 4;
  }
  message Snowflake {
    int32 node_id = 1;
  }
  message Sequence {
    string redis_key_prefix = 1;
  }
  message Resources {
    string users = 1;
    string sessions = 2;
    string documents = 3;
  }
  string default_strategy = 1; // uuid | ulid | snowflake | sequence | random
  Random random = 2;
  Snowflake snowflake = 3;
  Sequence sequence = 4;
  Resources resources = 5;
}

// Analytics 是事件分析平台级配置（docs/design/analytics.md §5，PR5）。
message Analytics {
  // 原始事件（analytics_events 月分区）与 user_days 的保留天数。保留期裁剪
  // 以整月 DROP 粒度执行（不足整月的部分留待下月）；查询面 raw 回退窗口
  // 护栏与本值同源。默认 90；可配域 7–365，越界值启动后钳制到边界
  // （domainanalytics.NormalizeRetentionDays）。
  // env: TORCHWOOD_ANALYTICS_RETENTION_DAYS
  int32 retention_days = 1;
}

// Payments 是 v3 支付子域配置（设计 §1.2）。渠道 secret 一律走
// TORCHWOOD_ 环境变量，不写入 config.yaml；未配置时服务可启动，
// 相关操作 fail-closed。
message Payments {
  message Stripe {
    // Secret key (sk_...). env: TORCHWOOD_PAYMENTS_STRIPE_SECRET_KEY
    string secret_key = 1;
    // Webhook signing secret (whsec_...). env: TORCHWOOD_PAYMENTS_STRIPE_WEBHOOK_SECRET
    string webhook_secret = 2;
    // REST API base URL; empty = https://api.stripe.com (tests may override).
    string api_base_url = 3;
  }
  message WeChat {
    string mch_id = 1;
    string app_id = 2;
    // APIv3 密钥（32 字节，回调 AES-256-GCM 解密）。env: TORCHWOOD_PAYMENTS_WECHAT_API_V3_KEY
    string api_v3_key = 3;
    // 商户 API 证书序列号。env: TORCHWOOD_PAYMENTS_WECHAT_MERCHANT_SERIAL_NO
    string merchant_serial_no = 4;
    // 商户 API 私钥 PEM。env: TORCHWOOD_PAYMENTS_WECHAT_MERCHANT_PRIVATE_KEY
    string merchant_private_key = 5;
    // 微信支付平台证书 PEM（验签）。env: TORCHWOOD_PAYMENTS_WECHAT_PLATFORM_CERT
    string platform_cert = 6;
    // 可选：覆盖回调 URL；空则用 server.http.public_url + /v1/payments/callbacks/wechat。
    string notify_url = 7;
    // REST API base URL; empty = https://api.mch.weixin.qq.com（tests may override）。
    string api_base_url = 8;
  }
  message Alipay {
    string app_id = 1;
    // 应用私钥 PEM。env: TORCHWOOD_PAYMENTS_ALIPAY_APP_PRIVATE_KEY
    string app_private_key = 2;
    // 支付宝公钥 PEM。env: TORCHWOOD_PAYMENTS_ALIPAY_ALIPAY_PUBLIC_KEY
    string alipay_public_key = 3;
    // 可选：覆盖回调 URL；空则用 server.http.public_url + /v1/payments/callbacks/alipay。
    string notify_url = 4;
    // 开放平台网关; empty = https://openapi.alipay.com/gateway.do。
    string gateway_url = 5;
  }
  message IosIap {
    string bundle_id = 1;
    // verifyReceipt shared secret。env: TORCHWOOD_PAYMENTS_IOS_IAP_SHARED_SECRET
    string shared_secret = 2;
    // App Store Connect API（StoreKit 2 / ASN 备用）issuer。
    string issuer_id = 3;
    string key_id = 4;
    // App Store Connect API .p8 PEM。env: TORCHWOOD_PAYMENTS_IOS_IAP_PRIVATE_KEY
    string private_key = 5;
    // Apple Root CA PEM（可多张）；空则使用内置 Apple Root CA - G3。
    // env: TORCHWOOD_PAYMENTS_IOS_IAP_APPLE_ROOT_CERT
    string apple_root_cert = 6;
    // verifyReceipt 生产地址；空 = https://buy.itunes.apple.com/verifyReceipt。
    string verify_receipt_url = 7;
    // verifyReceipt 沙盒地址；空 = https://sandbox.itunes.apple.com/verifyReceipt。
    string sandbox_verify_url = 8;
  }
  Stripe stripe = 1;
  WeChat wechat = 2;
  Alipay alipay = 3;
  IosIap ios_iap = 4;
}
